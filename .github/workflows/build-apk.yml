            };

            function degToCompass(deg) {
              var dirs = ['N','NE','E','SE','S','SW','W','NW'];
              return dirs[Math.round(((deg % 360) / 45)) % 8] + ' ' + Math.round(deg) + '°';
            }
            function fmtPace(p) {
              if (!p || p <= 0 || p > 40) return '--:--';
              var m = Math.floor(p), s = Math.round((p - m) * 60);
              if (s === 60) { m++; s = 0; }
              return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
            }

            window.__onAJNativeGpsStatus = function(code, msg) {
              var pill = document.getElementById('ajBgPill'), locBtn = document.getElementById('ajTurnOnGpsBtn'), strip = document.getElementById('ariseLiveGpsStrip');
              if (code === 'STOPPED' && strip) strip.classList.remove('active');
              if (pill) {
                pill.textContent = msg; pill.classList.remove('live', 'err');
                if (code === 'GPS_OFF' || code === 'NO_PERM' || code === 'ERR') pill.classList.add('err');
              }
              if (locBtn) locBtn.style.display = (code === 'GPS_OFF') ? 'inline-block' : 'none';
            };

            window.__onAJNativeGps = function(d) {
              latestFusedDistM = Math.max(latestFusedDistM, d.distM || 0);
              if (d.lat && d.lng) {
                uMap.lat = d.lat; uMap.lng = d.lng; uMap.acc = d.acc || 15; uMap.bearing = d.bearing || 0; uMap.spd = d.spd || 0;
                if (uMap.autoFollow) { uMap.panX = 0; uMap.panY = 0; }
                if (window.AJNative && window.AJNative.getRoutePoints) {
                  try { uMap.route = JSON.parse(window.AJNative.getRoutePoints()); } catch(e) {}
                }
              }

              if (window.__ajToGeoPos && window.__ajGpsWatchers) {
                var isFirst = !window.__ajSentFirstLock;
                if (isFirst || d.acc <= 75) {
                  window.__ajSentFirstLock = true;
                  var pos = window.__ajToGeoPos(d, isFirst);
                  Object.keys(window.__ajGpsWatchers).forEach(function(k) { try { window.__ajGpsWatchers[k](pos); } catch(e) {} });
                }
              }

              var strip = document.getElementById('ariseLiveGpsStrip');
              if (strip) {
                strip.classList.add('active');
                var sl = document.getElementById('ariseStripLeft'), sr = document.getElementById('ariseStripRight');
                var m = String(Math.floor((d.sec || 0) / 60)).padStart(2, '0'), s = String((d.sec || 0) % 60).padStart(2, '0');
                if (sl) sl.textContent = '🟢 GPS LIVE • ' + (d.distM / 1000).toFixed(2) + ' km • ' + (d.spd || 0).toFixed(1) + ' km/h';
                if (sr) sr.textContent = m + ':' + s + ' • ±' + Math.round(d.acc) + 'm';
              }

              var pill = document.getElementById('ajBgPill'), locBtn = document.getElementById('ajTurnOnGpsBtn');
              if (locBtn) locBtn.style.display = 'none';
              if (pill) {
                pill.textContent = 'LIVE • ±' + Math.round(d.acc) + 'm • SAT ' + (d.satU || 0) + '/' + (d.satT || 0);
                pill.classList.remove('err'); pill.classList.add('live');
              }

              var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
              set('ajHudDist', (d.distM / 1000).toFixed(2) + ' km');
              set('ajHudAvg', (d.spd || 0).toFixed(1) + ' km/h');
              set('ajHudPace', fmtPace(d.pace) + ' /km');
              set('ajHudElev', '+' + Math.round(d.elevGain || 0) + ' m');
              set('ajHudComp', degToCompass(d.bearing || 0));
              set('ajHudSteps', String(latestHwSteps || d.steps || 0));
              set('ajHudPts', String(d.pts || 0));
              set('ajHudCoords', d.lat.toFixed(5) + ', ' + d.lng.toFixed(5));
              set('ariseMapHudSpeed', '⚡ ' + (d.spd || 0).toFixed(1) + ' km/h');
              set('ariseMapHudPace', '⏱ ' + fmtPace(d.pace) + '/km');
              set('ariseMapHudCad', '👟 ' + (d.cadence || 0) + ' spm');
              set('ariseMapHudKcal', '🔥 ' + Math.round(d.kcal || 0) + ' kcal');
              syncQuestDistanceAndSteps();
            };

            function mountGpsHud() {
              if (document.getElementById('ajProGpsHud')) return;
              var proBtn = Array.from(document.querySelectorAll('button')).find(function(b) { return (b.textContent || '').toUpperCase().indexOf('PRO GPS') !== -1; });
              if (!proBtn) return;
              var card = proBtn.parentElement;
              while (card && card.parentElement && card.textContent.toUpperCase().indexOf('PRO ROUTE') === -1) card = card.parentElement;
              if (!card || !card.parentElement) return;

              var hud = document.createElement('div');
              hud.id = 'ajProGpsHud';
              hud.innerHTML =
                '<div class="aj-hud-row">' +
                  '<span style="font-size:11px;font-weight:800;color:#00f7ff;">⚡ KALMAN FUSED GPS ULTRA PRO MAX</span>' +
                  '<span id="ajBgPill" class="aj-bg-pill">BG GPS STANDBY</span>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:8px;">' +
                  '<button class="aj-layer-btn active" data-mode="dark" onclick="window.__ajSetMapMode(\'dark\')">CYBER DARK</button>' +
                  '<button class="aj-layer-btn" data-mode="sat" onclick="window.__ajSetMapMode(\'sat\')">SATELLITE</button>' +
                  '<button class="aj-layer-btn" data-mode="street" onclick="window.__ajSetMapMode(\'street\')">STREET</button>' +
                  '<button class="aj-layer-btn" data-mode="topo" onclick="window.__ajSetMapMode(\'topo\')">TOPO</button>' +
                '</div>' +
                '<div id="ariseUltraMapWrap">' +
                  '<canvas id="ariseUltraMapCanvas"></canvas>' +
                  '<div class="arise-map-legend">TRAIL: <span style="color:#00f7ff">WALK</span> • <span style="color:#00e676">JOG</span> • <span style="color:#ffd54f">RUN</span> • <span style="color:#ff3d00">SPRINT</span></div>' +
                  '<div class="arise-map-ctrl-col">' +
                    '<button class="arise-map-fab" onclick="window.__ariseMapZoom(1)">+</button>' +
                    '<button class="arise-map-fab" onclick="window.__ariseMapZoom(-1)">−</button>' +
                    '<button class="arise-map-fab" onclick="window.__ariseMapRecenter()">🎯</button>' +
                    '<button class="arise-map-fab" onclick="window.__ariseMapToggleFs()">⛶</button>' +
                  '</div>' +
                  '<div class="arise-map-bottom-hud">' +
                    '<span id="ariseMapHudSpeed">⚡ 0.0 km/h</span>' +
                    '<span id="ariseMapHudPace">⏱ --:--/km</span>' +
                    '<span id="ariseMapHudCad">👟 0 spm</span>' +
                    '<span id="ariseMapHudKcal">🔥 0 kcal</span>' +
                  '</div>' +
                '</div>' +
                '<div class="aj-hud-grid">' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">FUSED DIST</div><div id="ajHudDist" class="aj-hud-val">0.00 km</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">LIVE SPD</div><div id="ajHudAvg" class="aj-hud-val">0.0 km/h</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">PACE</div><div id="ajHudPace" class="aj-hud-val">--:-- /km</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">CLIMB</div><div id="ajHudElev" class="aj-hud-val">+0 m</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">COMPASS</div><div id="ajHudComp" class="aj-hud-val">N 0°</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">3X STEPS</div><div id="ajHudSteps" class="aj-hud-val">0</div></div>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:8px;font-size:10px;color:#8ad8f0;">' +
                  '<span>LAT/LNG: <b id="ajHudCoords">Waiting for lock...</b> (<span id="ajHudPts">0</span> pts)</span>' +
                  '<div style="display:flex;gap:5px;">' +
                    '<button id="ajTurnOnGpsBtn" onclick="window.AJNative && window.AJNative.openLocationSettings()" style="display:none;padding:4px 9px;border-radius:6px;border:1px solid #ff6e40;background:#4a1400;color:#ffab91;font-size:10px;font-weight:800;">TURN ON GPS</button>' +
                    '<button onclick="if(window.AJNative){if(window.AJNative.isBgGpsRunning()){window.AJNative.stopBgGps();}else{window.__ajSentFirstLock=false;window.AJNative.startBgGps(true);}}" style="padding:4px 9px;border-radius:6px;border:1px solid #00f0ff;background:#00334d;color:#00f7ff;font-size:10px;font-weight:800;">BG ON/OFF</button>' +
                  '</div>' +
                '</div>';
              card.parentElement.insertBefore(hud, card.nextSibling);

              // Touch pan support on Ultra Map
              var cvs = document.getElementById('ariseUltraMapCanvas');
              if (cvs) {
                cvs.addEventListener('touchstart', function(ev) {
                  if (ev.touches.length === 1) { uMap.dragging = true; uMap.autoFollow = false; uMap.lastX = ev.touches[0].clientX; uMap.lastY = ev.touches[0].clientY; }
                }, { passive: true });
                cvs.addEventListener('touchmove', function(ev) {
                  if (uMap.dragging && ev.touches.length === 1) {
                    uMap.panX += (ev.touches[0].clientX - uMap.lastX);
                    uMap.panY += (ev.touches[0].clientY - uMap.lastY);
                    uMap.lastX = ev.touches[0].clientX; uMap.lastY = ev.touches[0].clientY;
                  }
                }, { passive: true });
                cvs.addEventListener('touchend', function() { uMap.dragging = false; }, { passive: true });
              }

              if (!uMap.raf) uMap.raf = requestAnimationFrame(drawUltraMap);
              if (window.AJNative && window.AJNative.isBgGpsRunning()) {
                var st = window.AJNative.getBgGpsState();
                if (st) { try { window.__onAJNativeGps(JSON.parse(st)); } catch(e) {} }
              }
            }

            setTimeout(scheduleUiSync, 500);
            setTimeout(scheduleUiSync, 2300);
          })();
          </script>
          EOF

      - name: Setup Release Signing Keystore
        env:
          ARISE_KEYSTORE_B64: ${{ secrets.ARISE_KEYSTORE_B64 }}
          ARISE_STORE_PASS: ${{ secrets.ARISE_STORE_PASS }}
          ARISE_KEY_ALIAS: ${{ secrets.ARISE_KEY_ALIAS }}
          ARISE_KEY_PASS: ${{ secrets.ARISE_KEY_PASS }}
        run: |
          STORE_PASS="${ARISE_STORE_PASS:-Arise@2026Pro}"
          KEY_ALIAS="${ARISE_KEY_ALIAS:-arisekey}"
          KEY_PASS="${ARISE_KEY_PASS:-Arise@2026Pro}"
          if [ -n "$ARISE_KEYSTORE_B64" ]; then
            echo "$ARISE_KEYSTORE_B64" | base64 -d > app/arise-release.jks
            echo "Using saved GitHub Secret keystore."
          else
            keytool -genkeypair -v \
              -keystore app/arise-release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=ARISE Fitness, OU=Mobile, O=ARISE, L=India, S=IN, C=IN"
            cp app/arise-release.jks keystore-backup/arise-release.jks
            base64 -w 0 app/arise-release.jks > keystore-backup/ARISE_KEYSTORE_B64.txt
            echo "NEW_KEY_CREATED=true" >> $GITHUB_ENV
          fi

      - name: Build Signed Release AAB & APK
        env:
          ARISE_STORE_PASS: ${{ secrets.ARISE_STORE_PASS }}
          ARISE_KEY_ALIAS: ${{ secrets.ARISE_KEY_ALIAS }}
          ARISE_KEY_PASS: ${{ secrets.ARISE_KEY_PASS }}
        run: gradle bundleRelease assembleRelease

      - name: Upload Play Store Signed AAB & Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-PlayStore-Signed-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore Backup (SAVE TO GOOGLE DRIVE!)
        if: env.NEW_KEY_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-KEYSTORE-BACKUP-KEEP-SAFE
          path: keystore-backup/
