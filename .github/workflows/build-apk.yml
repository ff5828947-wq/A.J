            function highlightThemeButtons(activeName) {
              var a = (activeName || 'cyan').toUpperCase();
              document.querySelectorAll('button').forEach(function(b) {
                if (b.closest && b.closest('#ariseVipModal')) return;
                var clean = (b.textContent || '').replace(/[^A-Z]/gi, '').toUpperCase();
                if (['CYAN','VIOLET','RED','GREEN','PINK','GOLD','RGB','DARK','LIGHT'].indexOf(clean) !== -1) {
                  b.classList.toggle('arise-theme-active-btn', clean === a);
