                      try {
                          val i = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_SUBJECT, "ARISE: Daily Workout Report")
                              putExtra(Intent.EXTRA_TEXT, summary)
                          }
                          startActivity(Intent.createChooser(i, "Share ARISE Workout Report"))
