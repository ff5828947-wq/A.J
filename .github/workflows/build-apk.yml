            window.__ajSetMapMode = function(mode) {
              uMap.mode = mode;
              document.querySelectorAll('.aj-layer-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-mode') === mode); });
              if (window.AJNative && window.AJNative.setMapMode) window.AJNative.setMapMode(mode);
              var stamp = mode + '_' + Date.now();
              if (window.__ajTileImgs && window.__ajTileImgs.length) {
                window.__ajTileImgs.forEach(function(img) { try { var base = (img.src || '').split('?')[0]; if (base) img.src = base + '?ajm=' + stamp; } catch(e) {} });
              }
