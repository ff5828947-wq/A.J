            <div id="toast">Saved!</div>
            <script>
              (() => {
                'use strict';

                const RANKS = [
                  { lv: 1,  name: 'E-RANK' },
                  { lv: 4,  name: 'D-RANK' },
                  { lv: 8,  name: 'C-RANK' },
                  { lv: 14, name: 'B-RANK' },
                  { lv: 22, name: 'A-RANK' },
                  { lv: 32, name: 'S-RANK' },
                  { lv: 45, name: 'MONARCH' }
                ];

                const todayKey = () => {
                  const d = new Date();
                  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                };

                const DEFAULT_STATE = {
                  name: 'HUNTER',
                  theme: 'cyan',
                  level: 1,
                  xp: 0,
                  streak: 0,
                  repGoal: 100,
                  runGoal: 10,
                  beep: true,
                  pin: '',
                  lastDate: todayKey(),
                  daily: { pushups: 0, situps: 0, squats: 0, runKm: 0, water: 0, claimed: false },
                  totals: { pushups: 0, situps: 0, squats: 0, runKm: 0 },
                  completedDays: []
                };

                let state = (() => {
                  try {
                    const raw = localStorage.getItem('arise_workout_v2');
                    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
                    const p = JSON.parse(raw);
                    return {
                      ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
                      ...p,
                      daily: { ...DEFAULT_STATE.daily, ...(p.daily || {}) },
                      totals: { ...DEFAULT_STATE.totals, ...(p.totals || {}) },
                      completedDays: Array.isArray(p.completedDays) ? p.completedDays : []
                    };
                  } catch (e) {
                    return JSON.parse(JSON.stringify(DEFAULT_STATE));
                  }
                })();

                const saveState = () => {
                  try { localStorage.setItem('arise_workout_v2', JSON.stringify(state)); } catch (e) {}
                };

                // Daily rollover check
                if (state.lastDate !== todayKey()) {
                  state.lastDate = todayKey();
                  state.daily = { pushups: 0, situps: 0, squats: 0, runKm: 0, water: 0, claimed: false };
                  saveState();
                }

                // Audio Beep Engine
                let audioCtx = null;
                function playBeep(freq = 720, dur = 0.08) {
                  if (!state.beep) return;
                  try {
                    if (!audioCtx) {
                      const AC = window.AudioContext || window.webkitAudioContext;
                      if (AC) audioCtx = new AC();
                    }
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                    const t = audioCtx.currentTime;
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0.001, t);
                    g.gain.linearRampToValueAtTime(0.14, t + 0.01);
                    g.gain.linearRampToValueAtTime(0.001, t + dur);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(t);
                    o.stop(t + dur + 0.02);
                  } catch (e) {}
                }

                function vib(ms = 25) {
                  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
                }

                let toastTimer = null;
                function showToast(msg) {
                  const el = document.getElementById('toast');
                  el.textContent = msg;
                  el.classList.add('show');
                  clearTimeout(toastTimer);
                  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
                }

                // 9-THEME LIVE ENGINE (INCLUDING ANIMATED RGB!)
                let rgbTimer = null;
                let rgbHue = 190;
                function applyTheme(themeId) {
                  state.theme = themeId || 'cyan';
                  const root = document.documentElement;
                  if (rgbTimer) { clearInterval(rgbTimer); rgbTimer = null; }
                  root.style.removeProperty('--accent');
                  root.style.removeProperty('--accent2');
                  root.style.removeProperty('--accent-soft');
                  root.style.removeProperty('--accent-border');
                  root.style.removeProperty('--accent-glow');
                  root.style.removeProperty('--bg-grad');

                  if (state.theme === 'rgb') {
                    root.setAttribute('data-theme', 'cyan');
                    const tickRgb = () => {
                      rgbHue = (rgbHue + 4) % 360;
                      const h2 = (rgbHue + 45) % 360;
                      root.style.setProperty('--accent', `hsl(${rgbHue}, 100%, 58%)`);
                      root.style.setProperty('--accent2', `hsl(${h2}, 100%, 50%)`);
                      root.style.setProperty('--accent-soft', `hsla(${rgbHue}, 100%, 55%, 0.18)`);
                      root.style.setProperty('--accent-border', `hsla(${rgbHue}, 100%, 58%, 0.5)`);
                      root.style.setProperty('--accent-glow', `hsla(${rgbHue}, 100%, 55%, 0.36)`);
                      root.style.setProperty('--bg-grad', `radial-gradient(circle at 50% 0%, hsla(${rgbHue}, 100%, 50%, 0.15), #060a14 68%)`);
                    };
                    tickRgb();
                    rgbTimer = setInterval(tickRgb, 90);
                  } else {
                    root.setAttribute('data-theme', state.theme);
                  }

                  document.getElementById('activeThemeLbl').textContent = state.theme.toUpperCase();
                  document.querySelectorAll('[data-set-theme]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.setTheme === state.theme);
                  });
                  saveState();
                }

                function getRankName(lv) {
                  let r = RANKS[0].name;
                  for (const item of RANKS) if (lv >= item.lv) r = item.name;
                  return r;
                }

                function xpNeed(lv) {
                  return 100 + (lv - 1) * 50;
                }

                function addXp(amount) {
                  if (amount <= 0) return;
                  state.xp += amount;
                  let leveled = false;
                  while (state.xp >= xpNeed(state.level)) {
                    state.xp -= xpNeed(state.level);
                    state.level++;
                    leveled = true;
                  }
                  if (leveled) {
                    playBeep(980, 0.22);
                    showToast(`LEVEL UP! LV.${state.level} (${getRankName(state.level)})`);
                  }
                }

                function addExerciseReps(ex, delta) {
                  const prev = state.daily[ex] || 0;
                  const next = Math.max(0, prev + delta);
                  const diff = next - prev;
                  state.daily[ex] = next;
                  if (diff > 0) {
                    state.totals[ex] = (state.totals[ex] || 0) + diff;
                    addXp(diff);
                    playBeep(660, 0.05);
                    vib(15);
                  }
                  saveState();
                  renderAll();
                }

                function addRunDistance(deltaKm) {
                  const prev = state.daily.runKm || 0;
                  const next = Math.max(0, +(prev + deltaKm).toFixed(2));
                  const diff = +(next - prev).toFixed(2);
                  state.daily.runKm = next;
                  if (diff > 0) {
                    state.totals.runKm = +((state.totals.runKm || 0) + diff).toFixed(2);
                    addXp(Math.round(diff * 15));
                    playBeep(700, 0.06);
                    vib(20);
                  }
                  saveState();
                  renderAll();
                }

                function renderCalendar() {
                  const now = new Date();
                  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
                  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
                  document.getElementById('calMonthLbl').textContent = `${months[m]} ${y}`;
                  const daysInMonth = new Date(y, m + 1, 0).getDate();
                  const grid = document.getElementById('calGrid');
                  grid.innerHTML = '';
                  for (let d = 1; d <= daysInMonth; d++) {
                    const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const done = state.completedDays.includes(key);
                    const cell = document.createElement('div');
                    cell.className = 'cal-day' + (done ? ' done' : '') + (d === today ? ' today' : '');
                    cell.innerHTML = `<span>${d}</span>${done ? '<span style="font-size:8px;">✓</span>' : ''}`;
                    grid.appendChild(cell);
                  }
                }

                function renderAll() {
                  const rk = getRankName(state.level);
                  const need = xpNeed(state.level);
                  document.getElementById('hdrHunter').textContent = `${state.name} • LV.${state.level}`;
                  document.getElementById('hdrRank').textContent = rk;
                  document.getElementById('stRankBadge').textContent = rk;
                  document.getElementById('hdrXpTxt').textContent = `${state.xp} / ${need} XP`;
                  document.getElementById('hdrXpFill').style.width = `${Math.min(100, (state.xp / need) * 100)}%`;
                  document.getElementById('hdrStreak').textContent = `🔥 ${state.streak}d`;

                  const rg = Math.max(10, state.repGoal || 100);
                  const rkg = Math.max(1, state.runGoal || 10);

                  document.getElementById('qPushVal').textContent = `${state.daily.pushups} / ${rg}`;
                  document.getElementById('qPushBar').style.width = `${Math.min(100, (state.daily.pushups / rg) * 100)}%`;
                  document.getElementById('qSitVal').textContent = `${state.daily.situps} / ${rg}`;
                  document.getElementById('qSitBar').style.width = `${Math.min(100, (state.daily.situps / rg) * 100)}%`;
                  document.getElementById('qSquatVal').textContent = `${state.daily.squats} / ${rg}`;
                  document.getElementById('qSquatBar').style.width = `${Math.min(100, (state.daily.squats / rg) * 100)}%`;
                  document.getElementById('qRunVal').textContent = `${state.daily.runKm.toFixed(2)} / ${rkg.toFixed(1)} km`;
                  document.getElementById('qRunBar').style.width = `${Math.min(100, (state.daily.runKm / rkg) * 100)}%`;
                  document.getElementById('waterVal').textContent = `${state.daily.water} / 8 GLASSES`;

                  const allDone = state.daily.pushups >= rg && state.daily.situps >= rg && state.daily.squats >= rg;
                  document.getElementById('questStatusBadge').textContent = state.daily.claimed ? 'CLAIMED ✅' : (allDone ? 'READY TO CLAIM' : 'IN PROGRESS');

                  document.getElementById('stPush').textContent = state.totals.pushups.toLocaleString();
                  document.getElementById('stSit').textContent = state.totals.situps.toLocaleString();
                  document.getElementById('stSquat').textContent = state.totals.squats.toLocaleString();
                  document.getElementById('stRun').textContent = `${state.totals.runKm.toFixed(1)} km`;

                  document.getElementById('setHunterName').value = state.name;
                  document.getElementById('setRepGoal').value = state.repGoal;
                  document.getElementById('setRunGoal').value = state.runGoal;
                  document.getElementById('btnVoiceToggle').textContent = state.beep ? '🔊 BEEP: ON' : '🔇 BEEP: OFF';

                  renderCalendar();
                }

                // Navigation
                document.querySelectorAll('.nav-btn').forEach(btn => {
                  btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.pane).classList.add('active');
                    playBeep(520, 0.04);
                  });
                });

                // Splash & PIN
                const closeSplash = () => {
                  document.getElementById('splash').classList.add('hide');
                  setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 360);
                  if (state.pin && state.pin.length === 4) {
                    document.getElementById('pinOverlay').classList.add('open');
                  }
                };
                document.getElementById('btnSkipSplash').addEventListener('click', closeSplash);
                document.getElementById('btnEnterApp').addEventListener('click', () => { playBeep(780, 0.09); closeSplash(); });

                document.getElementById('btnPinUnlock').addEventListener('click', () => {
                  const val = document.getElementById('pinUnlockIn').value.trim();
                  if (val === state.pin) {
                    document.getElementById('pinOverlay').classList.remove('open');
                    document.getElementById('pinUnlockIn').value = '';
                    showToast('System Unlocked');
                  } else {
                    playBeep(220, 0.15);
                    showToast('Wrong PIN!');
                  }
                });

                // Quest Manual Buttons
                document.querySelectorAll('[data-add]').forEach(btn => {
                  btn.addEventListener('click', () => addExerciseReps(btn.dataset.add, parseInt(btn.dataset.val, 10)));
                });
                document.querySelectorAll('[data-run]').forEach(btn => {
                  btn.addEventListener('click', () => addRunDistance(parseFloat(btn.dataset.run)));
                });
                document.getElementById('btnAddWater').addEventListener('click', () => {
                  state.daily.water = Math.min(20, (state.daily.water || 0) + 1);
                  addXp(5);
                  playBeep(760, 0.06);
                  saveState();
                  renderAll();
                  showToast('💧 +1 Glass Water (+5 XP)');
                });
                document.getElementById('btnCompleteQuest').addEventListener('click', () => {
                  if (state.daily.claimed) { showToast('Already claimed today!'); return; }
                  state.daily.claimed = true;
                  const tk = todayKey();
                  if (!state.completedDays.includes(tk)) {
                    state.completedDays.push(tk);
                    state.streak++;
                  }
                  addXp(120);
                  playBeep(920, 0.2);
                  vib(50);
                  saveState();
                  renderAll();
                  showToast('⚔️ Daily Quest Claimed! +120 XP');
                });

                // TRACK TAB: Mode Switch & Exercise Selector
                let trackEx = 'pushups';
                let manualSession = 0;

                document.querySelectorAll('[data-tmode]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    const m = btn.dataset.tmode;
                    document.querySelectorAll('[data-tmode]').forEach(b => b.classList.toggle('active', b === btn));
                    document.getElementById('manualPadView').style.display = m === 'manual' ? 'block' : 'none';
                    document.getElementById('aiCamView').style.display = m === 'ai' ? 'block' : 'none';
                    document.getElementById('gpsRunView').style.display = m === 'run' ? 'block' : 'none';
                    document.getElementById('exSelectWrap').style.display = m === 'run' ? 'none' : 'grid';
                    document.getElementById('trackModeBadge').textContent = m === 'manual' ? 'MANUAL PAD' : (m === 'ai' ? 'AI CAMERA' : 'GPS RUN');
                    if (m !== 'ai') stopAiCamera();
                    playBeep(560, 0.04);
                  });
                });

                document.querySelectorAll('[data-tex]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    trackEx = btn.dataset.tex;
                    document.querySelectorAll('[data-tex]').forEach(b => b.classList.toggle('btn-solid', b === btn));
                    document.getElementById('manExLabel').textContent = `${trackEx.toUpperCase()} SESSION`;
                    playBeep(580, 0.04);
                  });
                });

                // MANUAL PAD LOGIC
                const updateManualUI = () => { document.getElementById('manCountNum').textContent = manualSession; };
                document.getElementById('btnManualTap').addEventListener('click', () => { manualSession++; updateManualUI(); playBeep(740, 0.05); vib(18); });
                document.getElementById('btnManMinus').addEventListener('click', () => { manualSession = Math.max(0, manualSession - 1); updateManualUI(); playBeep(420, 0.04); });
                document.getElementById('btnManPlus5').addEventListener('click', () => { manualSession += 5; updateManualUI(); playBeep(780, 0.06); vib(20); });
                document.getElementById('btnManPlus10').addEventListener('click', () => { manualSession += 10; updateManualUI(); playBeep(840, 0.07); vib(25); });
                document.getElementById('btnManReset').addEventListener('click', () => { manualSession = 0; updateManualUI(); });
                document.getElementById('btnManSave').addEventListener('click', () => {
                  if (manualSession <= 0) { showToast('Tap pad to count reps first!'); return; }
                  addExerciseReps(trackEx, manualSession);
                  showToast(`Saved +${manualSession} ${trackEx.toUpperCase()}!`);
                  manualSession = 0;
                  updateManualUI();
                });

                // FIXED AI CAMERA COUNTER (ANTI-AUTO-COUNT: CALIBRATION + STABILITY LOCK + DOWN HOLD + COOLDOWN!)
                let aiStream = null, aiRaf = null, aiRunning = false;
                let aiReps = 0, aiPhase = 'CALIBRATING', aiCalibFrames = 0;
                let aiBaseY = 0, aiSmoothY = 0, aiDownSince = 0, aiLastRepMs = 0;
                let aiPrevFrame = null;
                const procCanvas = document.createElement('canvas');
                procCanvas.width = 64; procCanvas.height = 48;
                const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

                function resetAiCalibration() {
                  aiPhase = 'CALIBRATING';
                  aiCalibFrames = 0;
                  aiBaseY = 0;
                  aiSmoothY = 0;
                  aiDownSince = 0;
                  document.getElementById('aiPhasePill').textContent = 'CALIBRATING';
                  document.getElementById('aiStatusTxt').textContent = 'HOLD STEADY FOR 1.5s...';
                }

                async function startAiCamera() {
                  if (aiRunning) return;
                  try {
                    aiStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 }, audio: false });
                    const video = document.getElementById('camVideo');
                    video.srcObject = aiStream;
                    await video.play();
                    aiRunning = true;
                    aiReps = 0;
                    aiPrevFrame = null;
                    document.getElementById('aiRepPill').textContent = 'REPS: 0';
                    resetAiCalibration();
                    aiLoop();
                  } catch (e) {
                    showToast('Camera permission denied! Use Manual Pad.');
                  }
                }

                function stopAiCamera() {
                  aiRunning = false;
                  if (aiRaf) { cancelAnimationFrame(aiRaf); aiRaf = null; }
                  if (aiStream) { aiStream.getTracks().forEach(t => t.stop()); aiStream = null; }
                  document.getElementById('aiPhasePill').textContent = 'STOPPED';
                  document.getElementById('aiStatusTxt').textContent = 'AI STOPPED • TAP START AI';
                }

                function aiLoop() {
                  if (!aiRunning) return;
                  const video = document.getElementById('camVideo');
                  const overlay = document.getElementById('camOverlay');
                  if (video.readyState >= 2) {
                    procCtx.drawImage(video, 0, 0, 64, 48);
                    const frame = procCtx.getImageData(0, 0, 64, 48).data;

                    // Compute dark/foreground vertical centroid + motion energy
                    let sumY = 0, weight = 0, motion = 0;
                    for (let y = 4; y < 44; y++) {
                      for (let x = 10; x < 54; x++) {
                        const idx = (y * 64 + x) * 4;
                        const lum = frame[idx] * 0.299 + frame[idx + 1] * 0.587 + frame[idx + 2] * 0.114;
                        if (aiPrevFrame) {
                          const pLum = aiPrevFrame[idx] * 0.299 + aiPrevFrame[idx + 1] * 0.587 + aiPrevFrame[idx + 2] * 0.114;
                          const diff = Math.abs(lum - pLum);
                          if (diff > 18) motion++;
                        }
                        // Track upper-body contrast centroid
                        const w = Math.max(0, 220 - lum);
                        sumY += y * w;
                        weight += w;
                      }
                    }
                    aiPrevFrame = new Uint8ClampedArray(frame);

                    const curY = weight > 100 ? (sumY / weight) : 24;
                    aiSmoothY = aiSmoothY === 0 ? curY : (aiSmoothY * 0.78 + curY * 0.22);

                    // Draw clean guide overlay
                    overlay.width = overlay.clientWidth || 320;
                    overlay.height = overlay.clientHeight || 240;
                    const oc = overlay.getContext('2d');
                    oc.clearRect(0, 0, overlay.width, overlay.height);
                    const lineY = (aiSmoothY / 48) * overlay.height;
                    oc.strokeStyle = aiPhase === 'DOWN' ? '#22e58b' : '#00e5ff';
                    oc.lineWidth = 2.5;
                    oc.beginPath(); oc.moveTo(20, lineY); oc.lineTo(overlay.width - 20, lineY); oc.stroke();

                    const now = performance.now();
                    // 1. Calibration phase (requires 35 steady frames, ignores camera shake)
                    if (aiPhase === 'CALIBRATING') {
                      if (motion < 180) {
                        aiBaseY = (aiBaseY * aiCalibFrames + aiSmoothY) / (aiCalibFrames + 1);
                        aiCalibFrames++;
                      }
                      if (aiCalibFrames >= 35) {
                        aiPhase = 'UP';
                        document.getElementById('aiPhasePill').textContent = 'READY (UP)';
                        document.getElementById('aiStatusTxt').textContent = 'LOCKED! GO DOWN FOR REP 1';
                        playBeep(820, 0.08);
                      }
                    } else {
                      const baseLineY = (aiBaseY / 48) * overlay.height;
                      oc.strokeStyle = 'rgba(255,255,255,0.4)';
                      oc.setLineDash([6, 6]);
                      oc.beginPath(); oc.moveTo(20, baseLineY); oc.lineTo(overlay.width - 20, baseLineY); oc.stroke();
                      oc.setLineDash([]);

                      // Strict vertical displacement threshold (prevents standing-still auto-count!)
                      const deltaY = aiSmoothY - aiBaseY;
                      const downThresh = 4.2; // Must clearly drop downward
                      const upThresh = 1.6;   // Must return near top baseline

                      if (aiPhase === 'UP') {
                        if (deltaY >= downThresh && motion > 12) {
                          if (aiDownSince === 0) aiDownSince = now;
                          // Must hold DOWN position for at least 220ms
                          if (now - aiDownSince >= 220) {
                            aiPhase = 'DOWN';
                            document.getElementById('aiPhasePill').textContent = 'DOWN ✓';
                            document.getElementById('aiStatusTxt').textContent = 'GOOD DEPTH! PUSH UP';
                          }
                        } else {
                          aiDownSince = 0;
                        }
                      } else if (aiPhase === 'DOWN') {
                        // Return to UP + strict 900ms cooldown between reps
                        if (deltaY <= upThresh && (now - aiLastRepMs) >= 900) {
                          aiReps++;
                          aiLastRepMs = now;
                          aiPhase = 'UP';
                          aiDownSince = 0;
                          document.getElementById('aiRepPill').textContent = `REPS: ${aiReps}`;
                          document.getElementById('aiPhasePill').textContent = 'UP ✓';
                          document.getElementById('aiStatusTxt').textContent = `REP #${aiReps} COUNTED!`;
                          playBeep(880, 0.09);
                          vib(30);
                        }
                      }
                    }
                  }
                  aiRaf = requestAnimationFrame(aiLoop);
                }

                document.getElementById('btnAiStart').addEventListener('click', startAiCamera);
                document.getElementById('btnAiCalib').addEventListener('click', () => { if (aiRunning) resetAiCalibration(); });
                document.getElementById('btnAiStop').addEventListener('click', stopAiCamera);
                document.getElementById('btnAiSave').addEventListener('click', () => {
                  if (aiReps <= 0) { showToast('No AI reps to save yet!'); return; }
                  addExerciseReps(trackEx, aiReps);
                  showToast(`Saved +${aiReps} AI ${trackEx.toUpperCase()}!`);
                  aiReps = 0;
                  document.getElementById('aiRepPill').textContent = 'REPS: 0';
                });

                // GPS & STEP RUN TRACKER
                let runActive = false, runWatchId = null, runTimerIv = null, runSec = 0, runKm = 0, lastPos = null;
                function haversineKm(lat1, lon1, lat2, lon2) {
                  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
                  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
                  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                }
                document.getElementById('btnRunStart').addEventListener('click', () => {
                  if (runActive) return;
                  runActive = true; runSec = 0; runKm = 0; lastPos = null;
                  if (window.AriseNative) window.AriseNative.resetHwSteps();
                  runTimerIv = setInterval(() => {
                    runSec++;
                    const mm = String(Math.floor(runSec / 60)).padStart(2, '0');
                    const ss = String(runSec % 60).padStart(2, '0');
                    document.getElementById('runTimeTxt').textContent = `${mm}:${ss}`;
                    const steps = window.AriseNative ? window.AriseNative.getHwSteps() : 0;
                    document.getElementById('runStepTxt').textContent = steps;
                    const stepKm = steps * 0.00075;
                    document.getElementById('runDistTxt').textContent = Math.max(runKm, stepKm).toFixed(2);
                  }, 1000);
                  if (navigator.geolocation) {
                    runWatchId = navigator.geolocation.watchPosition(pos => {
                      const { latitude, longitude, accuracy } = pos.coords;
                      if (accuracy > 45) return;
                      if (lastPos) {
                        const d = haversineKm(lastPos.lat, lastPos.lon, latitude, longitude);
                        if (d > 0.005 && d < 0.25) runKm += d;
                      }
                      lastPos = { lat: latitude, lon: longitude };
                    }, () => {}, { enableHighAccuracy: true });
                  }
                  showToast('🏃 Run Tracking Started');
                });
                document.getElementById('btnRunStop').addEventListener('click', () => {
                  if (!runActive) return;
                  runActive = false;
                  clearInterval(runTimerIv);
                  if (runWatchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(runWatchId);
                  const finalKm = parseFloat(document.getElementById('runDistTxt').textContent) || 0;
                  if (finalKm > 0) { addRunDistance(finalKm); showToast(`Saved ${finalKm.toFixed(2)} km!`); }
                  else showToast('Run Stopped');
                });

                // REST & HIIT TIMER
                let tTotal = 60, tLeft = 60, tIv = null;
                const renderTimer = () => {
                  const m = String(Math.floor(tLeft / 60)).padStart(2, '0');
                  const s = String(tLeft % 60).padStart(2, '0');
                  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
                };
                document.querySelectorAll('[data-tsec]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    clearInterval(tIv); tIv = null;
                    tTotal = parseInt(btn.dataset.tsec, 10); tLeft = tTotal;
                    document.getElementById('btnTimerToggle').textContent = '▶ START';
                    document.getElementById('timerStateBadge').textContent = 'READY';
                    renderTimer();
                  });
                });
                document.getElementById('btnTimerToggle').addEventListener('click', () => {
                  if (tIv) {
                    clearInterval(tIv); tIv = null;
                    document.getElementById('btnTimerToggle').textContent = '▶ RESUME';
                    document.getElementById('timerStateBadge').textContent = 'PAUSED';
                  } else {
                    document.getElementById('btnTimerToggle').textContent = '⏸ PAUSE';
                    document.getElementById('timerStateBadge').textContent = 'RUNNING';
                    tIv = setInterval(() => {
                      tLeft--;
                      renderTimer();
                      if (tLeft <= 0) {
                        clearInterval(tIv); tIv = null;
                        document.getElementById('btnTimerToggle').textContent = '▶ START';
                        document.getElementById('timerStateBadge').textContent = 'DONE!';
                        playBeep(960, 0.3); vib(120);
                        showToast('⏱️ Rest Complete! Back to Training!');
                        tLeft = tTotal;
                      }
                    }, 1000);
                  }
                });
                document.getElementById('btnTimerReset').addEventListener('click', () => {
                  clearInterval(tIv); tIv = null; tLeft = tTotal;
                  document.getElementById('btnTimerToggle').textContent = '▶ START';
                  document.getElementById('timerStateBadge').textContent = 'READY';
                  renderTimer();
                });

                document.querySelectorAll('[data-quickset]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    const n = parseInt(btn.dataset.quickset, 10);
                    addExerciseReps('pushups', n);
                    addExerciseReps('situps', n);
                    addExerciseReps('squats', n);
                    showToast(`🔥 +${n} Push-Ups, Sit-Ups & Squats!`);
                  });
                });

                // BMI & CALORIE CALCULATOR
                document.getElementById('btnCalcBmi').addEventListener('click', () => {
                  const w = parseFloat(document.getElementById('bmiWeight').value) || 0;
                  const h = (parseFloat(document.getElementById('bmiHeight').value) || 0) / 100;
                  if (w <= 0 || h <= 0) return;
                  const bmi = w / (h * h);
                  const cat = bmi < 18.5 ? 'UNDERWEIGHT' : (bmi < 25 ? 'NORMAL' : (bmi < 30 ? 'OVERWEIGHT' : 'OBESE'));
                  const kcal = Math.round((state.daily.pushups + state.daily.situps + state.daily.squats) * 0.45 + state.daily.runKm * 62);
                  document.getElementById('bmiBadge').textContent = `BMI ${bmi.toFixed(1)}`;
                  document.getElementById('bmiResult').textContent = `${cat} • Today's Est. Burn: ${kcal} kcal`;
                  playBeep(720, 0.06);
                });

                // SETTINGS: 9 THEMES, PROFILE, VOICE, ALERTS, PIN
                document.querySelectorAll('[data-set-theme]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    applyTheme(btn.dataset.setTheme);
                    playBeep(680, 0.05);
                    showToast(`Theme: ${btn.dataset.setTheme.toUpperCase()}`);
                  });
                });

                document.getElementById('btnSaveGoals').addEventListener('click', () => {
                  state.name = (document.getElementById('setHunterName').value.trim() || 'HUNTER').toUpperCase();
                  state.repGoal = Math.max(10, parseInt(document.getElementById('setRepGoal').value, 10) || 100);
                  state.runGoal = Math.max(1, parseFloat(document.getElementById('setRunGoal').value) || 10);
                  saveState();
                  renderAll();
                  playBeep(820, 0.08);
                  showToast('Profile & Goals Saved!');
                });

                document.getElementById('btnVoiceToggle').addEventListener('click', () => {
                  state.beep = !state.beep;
                  saveState();
                  renderAll();
                  if (state.beep) playBeep(740, 0.07);
                });

                document.getElementById('btnTestAlert').addEventListener('click', () => {
                  if (window.AriseNative) {
                    window.AriseNative.sendTestNotification('⚔️ ARISE Daily Quest', 'Your daily push-ups, sit-ups & squats are waiting!');
                  } else {
                    showToast('🔔 Test Alert Triggered!');
                  }
                });

                document.getElementById('btnSetPin').addEventListener('click', () => {
                  const p = document.getElementById('setPinIn').value.trim();
                  if (p === '') {
                    state.pin = '';
                    saveState();
                    showToast('PIN Lock Cleared');
                  } else if (/^\d{4}$/.test(p)) {
                    state.pin = p;
                    document.getElementById('setPinIn').value = '';
                    saveState();
                    showToast('🔒 4-Digit PIN Saved!');
                  } else {
                    showToast('Enter exactly 4 digits (or leave empty to clear)');
                  }
                });

                // Init
                applyTheme(state.theme);
                renderAll();
                renderTimer();
              })();
            </script>
          </body>
          </html>
          ARISEHTML

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/arise-release.jks \
            -alias arisekey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Arise@2026" -keypass "Arise@2026" \
            -dname "CN=ARISE Workout, OU=Fitness, O=AriseApp, L=India, S=IN, C=IN"

      - name: Build Signed Release APK & AAB
        run: gradle assembleRelease bundleRelease

      - name: Upload ARISE Android APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-Daily-Workout-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
