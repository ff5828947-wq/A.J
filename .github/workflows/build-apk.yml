            .aj-hud-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
            .aj-hud-box {
              background: rgba(0,0,0,0.42); border: 1px solid rgba(0,229,255,0.22);
              border-radius: 8px; padding: 6px 4px; text-align: center;
            }
            .aj-hud-lbl { font-size: 9px; color: #7ec8e3; letter-spacing: 0.6px; }
            .aj-hud-val { font-size: 13px; font-weight: 700; color: #00f0ff; margin-top: 2px; }
            .aj-layer-btn {
              flex: 1; padding: 5px 4px; font-size: 10px; font-weight: 700; border-radius: 6px;
              border: 1px solid rgba(0,229,255,0.35); background: rgba(0,20,38,0.85); color: #9be7ff;
            }
            .aj-layer-btn.active { background: #00e5ff; color: #03131f; box-shadow: 0 0 10px rgba(0,229,255,0.6); }
            .aj-bg-pill {
              font-size: 10px; padding: 3px 8px; border-radius: 99px; font-weight: 700;
              background: rgba(255,196,0,0.18); color: #ffd54f; border: 1px solid rgba(255,196,0,0.45);
            }
            .aj-bg-pill.live { background: rgba(0,230,118,0.18); color: #00e676; border-color: rgba(0,230,118,0.6); }
            .aj-bg-pill.err { background: rgba(255,61,0,0.22); color: #ff6e40; border-color: rgba(255,61,0,0.65); }
          </style>
          <script>
          (function(){
            // 1. Cinematic ARISE Boot Intro
            function playAriseIntro(force) {
              var allow = force || !(window.AJNative && window.AJNative.isIntroEnabled && !window.AJNative.isIntroEnabled());
              if (!allow) return;
              var old = document.getElementById('ariseIntroOverlay');
              if (old) old.remove();
              var ov = document.createElement('div');
              ov.id = 'ariseIntroOverlay';
              ov.innerHTML =
                '<div class="arise-grid-bg"></div>' +
                '<div class="arise-core-wrap">' +
                  '<div class="arise-ring-1"></div>' +
                  '<div class="arise-ring-2"></div>' +
                  '<div class="arise-emblem">A</div>' +
                '</div>' +
                '<div class="arise-sys-tag">[ SYSTEM AWAKENING ]</div>' +
                '<div class="arise-title">ARISE</div>' +
                '<div class="arise-sub">DAILY WORKOUT EXERCISE</div>' +
                '<div class="arise-bar-wrap"><div id="ariseBarFill" class="arise-bar-fill"></div></div>' +
                '<div id="ariseBootTxt" class="arise-boot-txt">INITIALIZING HARDWARE SENSORS...</div>';
              document.body.appendChild(ov);
              var steps = [
                [30, 'SYNCING GOOGLE FUSED GPS...'],
                [65, 'CALIBRATING HARDWARE STEP ENGINE...'],
                [100, 'SYSTEM READY — ARISE!']
              ];
              steps.forEach(function(st, idx) {
                setTimeout(function() {
                  var b = document.getElementById('ariseBarFill');
                  var t = document.getElementById('ariseBootTxt');
                  if (b) b.style.width = st[0] + '%';
                  if (t) t.textContent = st[1];
                  if (idx === 2 && window.AJNative && window.AJNative.vibrate) window.AJNative.vibrate(25);
                }, 420 * (idx + 1));
              });
              setTimeout(function() {
                ov.classList.add('hide');
                setTimeout(function(){ ov.remove(); }, 700);
              }, 2150);
            }
            window.__arisePlayIntro = playAriseIntro;
            if (document.body) playAriseIntro(false);
            else document.addEventListener('DOMContentLoaded', function(){ playAriseIntro(false); });

            // 2. Biometric Lock Screen Overlay
            function ensureLockScreen() {
              if (document.getElementById('ariseLockOverlay')) return;
              var lk = document.createElement('div');
              lk.id = 'ariseLockOverlay';
              lk.innerHTML =
                '<div class="arise-lock-icon">🔒</div>' +
                '<div style="font-size:20px;font-weight:900;letter-spacing:3px;color:#00f7ff;">ARISE LOCKED</div>' +
                '<div id="ariseLockMsg" style="font-size:11px;color:#8ad8f0;margin-top:6px;">VERIFY FINGERPRINT / DEVICE LOCK TO ENTER</div>' +
                '<button class="arise-lock-btn" onclick="window.AJNative && window.AJNative.triggerBiometric(\'Unlock ARISE System\')">AUTHENTICATE NOW</button>';
              document.body.appendChild(lk);
            }
            window.__ajShowLockScreen = function() {
              ensureLockScreen();
              var lk = document.getElementById('ariseLockOverlay');
              if (lk) lk.classList.add('open');
              if (window.AJNative && window.AJNative.triggerBiometric) {
                setTimeout(function(){ window.AJNative.triggerBiometric('Unlock ARISE System'); }, 250);
              }
            };
            window.__onAJBioResult = function(ok, msg) {
              var lk = document.getElementById('ariseLockOverlay');
              var m = document.getElementById('ariseLockMsg');
              if (ok) {
                if (lk) lk.classList.remove('open');
              } else if (m) {
                m.textContent = 'AUTH REQUIRED: ' + msg;
              }
            };
            setTimeout(function() {
              if (window.AJNative && window.AJNative.isBioLockEnabled && window.AJNative.isBioLockEnabled()) {
                window.__ajShowLockScreen();
              }
            }, 2250);

            // 3. Permanently Hide DEV TEST BAR (+500M, SIMULATE NEXT DAY, etc.) for Play Store
            function hideDevTestBar() {
              var all = document.querySelectorAll('div, section');
              for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (el.id === 'ariseProModal' || el.id === 'ajProGpsHud') continue;
                var txt = (el.textContent || '').toUpperCase();
                if (txt.indexOf('DEV TEST BAR') !== -1 && txt.indexOf('SIMULATE NEXT DAY') !== -1 && el.children.length < 15) {
                  if (el.offsetHeight < 420) {
                    el.style.display = 'none';
                  }
                }
              }
            }

            // 4. Sync Real Hardware Steps into QUEST tab + TRACK HUD
            var latestHwSteps = 0;
            window.__onAJNativeStep = function(cnt) {
              latestHwSteps = cnt || 0;
              var hudSteps = document.getElementById('ajHudSteps');
              if (hudSteps) hudSteps.textContent = String(latestHwSteps);
              var proSteps = document.getElementById('ariseProStepsVal');
              if (proSteps) proSteps.textContent = latestHwSteps + ' steps';
              // Replace jittery web step text ("• XX steps") in QUEST card with accurate hardware steps
              document.querySelectorAll('div, span, p, small').forEach(function(el) {
                if (el.children.length === 0 && el.textContent && /•\s*\d+\s*steps/i.test(el.textContent)) {
                  el.textContent = el.textContent.replace(/•\s*\d+\s*steps/i, '• ' + latestHwSteps + ' steps');
                }
              });
            };
            if (window.AJNative && window.AJNative.getSteps) {
              setTimeout(function(){ window.__onAJNativeStep(window.AJNative.getSteps()); }, 800);
            }

            // 5. Haptic Feedback + Auto-Sync Reset & GPS Buttons
            document.addEventListener('click', function(e) {
              var btn = e.target && e.target.closest ? e.target.closest('button') : null;
              if (!btn || !window.AJNative) return;
              if (window.AJNative.vibrate) window.AJNative.vibrate(14);
              var txt = (btn.textContent || '').toUpperCase();
              if (txt.indexOf('START PRO GPS') !== -1) {
                window.__ajSentFirstLock = false;
                window.AJNative.startBgGps(true);
              } else if (txt.indexOf('STOP PRO GPS') !== -1) {
                window.AJNative.stopBgGps();
              } else if (txt.indexOf('RESET RUN') !== -1) {
                setTimeout(function(){ if (window.AJNative.resetSteps) window.AJNative.resetSteps(); }, 350);
              }
            }, true);

            // 6. Native Alarm Bridge
            if (window.AJNative && window.saveToggleAlarm) {
              var origAlm = window.saveToggleAlarm;
              window.saveToggleAlarm = function () {
                origAlm();
                try {
                  var t = (document.getElementById('inAlarmTime').value || '06:00').split(':');
                  var lbl = document.getElementById('inAlarmLbl').value || 'DAILY QUEST — ARISE!';
                  var pill = document.getElementById('alarmPill').textContent || '';
                  if (pill.indexOf('ON') === 0) {
                    window.AJNative.scheduleAlarm(parseInt(t[0],10), parseInt(t[1],10), lbl);
                    window.AJNative.showNotif('ARISE ALARM SET', 'Background alarm active for ' + t[0] + ':' + t[1]);
                  } else {
                    window.AJNative.cancelAlarm();
                  }
                } catch (e) {}
              };
            }

            // 7. Pro Control Center (Settings, Fingerprint Lock, Allow All The Time GPS, Step Engine)
            function refreshProModal() {
              if (!window.AJNative) return;
              var bioOn = window.AJNative.isBioLockEnabled();
              var hapOn = window.AJNative.isHapticsEnabled();
              var intOn = window.AJNative.isIntroEnabled();
              var bgLoc = window.AJNative.hasBackgroundLocation();
              var hwStp = window.AJNative.hasHardwareSteps();
              var setBtn = function(id, on, lblOn, lblOff) {
                var b = document.getElementById(id);
                if (!b) return;
                b.textContent = on ? lblOn : lblOff;
                b.classList.toggle('on', on);
              };
              setBtn('ariseBioBtn', bioOn, 'ON', 'OFF');
              setBtn('ariseHapBtn', hapOn, 'ON', 'OFF');
              setBtn('ariseIntBtn', intOn, 'ON', 'OFF');
              var locEl = document.getElementById('ariseBgLocBtn');
              if (locEl) {
                locEl.textContent = bgLoc ? 'ALL TIME ✓' : 'ENABLE';
                locEl.classList.toggle('on', bgLoc);
              }
              var stpEl = document.getElementById('ariseProStepsVal');
              if (stpEl) stpEl.textContent = (window.AJNative.getSteps() || 0) + (hwStp ? ' (HW SENSOR)' : ' (SOFT)');
            }

            function mountProCenter() {
              if (document.getElementById('ariseProFab')) return;
              var fab = document.createElement('button');
              fab.id = 'ariseProFab';
              fab.textContent = '⚙️ PRO';
              fab.onclick = function() {
                var m = document.getElementById('ariseProModal');
                if (m) { m.classList.add('open'); refreshProModal(); }
              };
              document.body.appendChild(fab);

              var modal = document.createElement('div');
              modal.id = 'ariseProModal';
              modal.innerHTML =
                '<div class="arise-pro-card">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                    '<span style="font-size:14px;font-weight:900;color:#00f7ff;letter-spacing:1.5px;">⚡ ARISE PRO SETTINGS</span>' +
                    '<button onclick="document.getElementById(\'ariseProModal\').classList.remove(\'open\')" style="background:none;border:none;color:#ff6e40;font-size:18px;font-weight:900;">✕</button>' +
                  '</div>' +
                  '<div class="arise-pro-row">' +
                    '<div><div style="font-size:12px;font-weight:700;">🔒 Fingerprint / App Lock</div><div style="font-size:10px;color:#7ec8e3;">Biometric or PIN on app open</div></div>' +
                    '<button id="ariseBioBtn" class="arise-pro-btn" onclick="if(window.AJNative){var n=!window.AJNative.isBioLockEnabled();window.AJNative.setBioLockEnabled(n);if(n)window.AJNative.triggerBiometric(\'Confirm Fingerprint Lock\');setTimeout(window.__ariseRefreshPro,200);}">OFF</button>' +
                  '</div>' +
                  '<div class="arise-pro-row">' +
                    '<div><div style="font-size:12px;font-weight:700;">📍 Allow All The Time GPS</div><div style="font-size:10px;color:#7ec8e3;">Pocket & screen-off tracking</div></div>' +
                    '<button id="ariseBgLocBtn" class="arise-pro-btn" onclick="window.AJNative && window.AJNative.requestBackgroundLocation()">ENABLE</button>' +
                  '</div>' +
                  '<div class="arise-pro-row">' +
                    '<div><div style="font-size:12px;font-weight:700;">👟 Hardware Step Engine</div><div id="ariseProStepsVal" style="font-size:10px;color:#00e676;">0 steps</div></div>' +
                    '<button class="arise-pro-btn" onclick="window.AJNative && window.AJNative.resetSteps();setTimeout(window.__ariseRefreshPro,200);">RESET</button>' +
                  '</div>' +
                  '<div class="arise-pro-row">' +
                    '<div><div style="font-size:12px;font-weight:700;">📳 Haptic Touch Feedback</div><div style="font-size:10px;color:#7ec8e3;">Crisp vibration on button tap</div></div>' +
                    '<button id="ariseHapBtn" class="arise-pro-btn on" onclick="if(window.AJNative){window.AJNative.setHapticsEnabled(!window.AJNative.isHapticsEnabled());window.__ariseRefreshPro();}">ON</button>' +
                  '</div>' +
                  '<div class="arise-pro-row">' +
                    '<div><div style="font-size:12px;font-weight:700;">✨ Cinematic Boot Intro</div><div style="font-size:10px;color:#7ec8e3;">ARISE awakening animation</div></div>' +
                    '<div style="display:flex;gap:5px;">' +
                      '<button class="arise-pro-btn" onclick="document.getElementById(\'ariseProModal\').classList.remove(\'open\');window.__arisePlayIntro(true);">PLAY</button>' +
                      '<button id="ariseIntBtn" class="arise-pro-btn on" onclick="if(window.AJNative){window.AJNative.setIntroEnabled(!window.AJNative.isIntroEnabled());window.__ariseRefreshPro();}">ON</button>' +
                    '</div>' +
                  '</div>' +
                  '<div style="margin-top:12px;padding:8px;border-radius:8px;background:rgba(0,229,255,0.08);font-size:10px;color:#8ad8f0;line-height:1.45;">' +
                    '<b>ARISE: Daily Workout Exercise v3.0 PRO</b><br/>' +
                    'All workout, GPS, and step data stays 100% locally on your device. No personal data is sold or shared.' +
                  '</div>' +
                '</div>';
              document.body.appendChild(modal);
              window.__ariseRefreshPro = refreshProModal;
            }

            // 8. Map Mode Switcher & Pro GPS HUD
            window.__ajSetMapMode = function(mode) {
              document.querySelectorAll('.aj-layer-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-mode') === mode);
              });
              if (window.AJNative && window.AJNative.setMapMode) window.AJNative.setMapMode(mode);
              var stamp = mode + '_' + Date.now();
              if (window.__ajTileImgs && window.__ajTileImgs.length) {
                window.__ajTileImgs.forEach(function(img) {
                  try { var base = (img.src || '').split('?')[0]; if (base) img.src = base + '?ajm=' + stamp; } catch(e) {}
                });
              }
              setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 350);
            };

            function degToCompass(deg) {
              var dirs = ['N','NE','E','SE','S','SW','W','NW'];
              return dirs[Math.round(((deg % 360) / 45)) % 8] + ' ' + Math.round(deg) + '°';
            }

            window.__onAJNativeGpsStatus = function(code, msg) {
              var pill = document.getElementById('ajBgPill');
              var locBtn = document.getElementById('ajTurnOnGpsBtn');
              if (pill) {
                pill.textContent = msg;
                pill.classList.remove('live', 'err');
                if (code === 'GPS_OFF' || code === 'NO_PERM' || code === 'ERR') pill.classList.add('err');
              }
              if (locBtn) locBtn.style.display = (code === 'GPS_OFF') ? 'inline-block' : 'none';
            };

            window.__onAJNativeGps = function(d) {
              if (window.__ajToGeoPos && window.__ajGpsWatchers) {
                var isFirst = !window.__ajSentFirstLock;
                if (isFirst || d.acc <= 75) {
                  window.__ajSentFirstLock = true;
                  var pos = window.__ajToGeoPos(d, isFirst);
                  Object.keys(window.__ajGpsWatchers).forEach(function(k) {
                    try { window.__ajGpsWatchers[k](pos); } catch(e) {}
                  });
                }
              }
              var pill = document.getElementById('ajBgPill');
              var locBtn = document.getElementById('ajTurnOnGpsBtn');
              if (locBtn) locBtn.style.display = 'none';
              if (pill) {
                pill.textContent = 'LIVE • ±' + Math.round(d.acc) + 'm • SAT ' + (d.satU || 0) + '/' + (d.satT || 0);
                pill.classList.remove('err');
                pill.classList.add('live');
              }
              var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
              set('ajHudDist', (d.distM / 1000).toFixed(2) + ' km');
              set('ajHudAvg', d.avgSpd.toFixed(1) + ' km/h');
              set('ajHudElev', '+' + Math.round(d.elevGain) + ' m');
              set('ajHudComp', degToCompass(d.bearing));
              set('ajHudSteps', String(latestHwSteps || d.steps));
              set('ajHudPts', String(d.pts));
              set('ajHudCoords', d.lat.toFixed(5) + ', ' + d.lng.toFixed(5));
            };

            function mountHud() {
              hideDevTestBar();
              mountProCenter();
              if (latestHwSteps > 0) window.__onAJNativeStep(latestHwSteps);
              if (document.getElementById('ajProGpsHud')) return;
              var proBtn = Array.from(document.querySelectorAll('button')).find(function(b) {
                return (b.textContent || '').toUpperCase().indexOf('PRO GPS') !== -1;
              });
              if (!proBtn) return;

              var card = proBtn.parentElement;
              while (card && card.parentElement && card.textContent.toUpperCase().indexOf('PRO ROUTE') === -1) {
                card = card.parentElement;
              }
              if (!card || !card.parentElement) return;

              var hud = document.createElement('div');
              hud.id = 'ajProGpsHud';
              hud.innerHTML =
                '<div class="aj-hud-row">' +
                  '<span style="font-size:11px;font-weight:700;color:#00e5ff;">⚡ GOOGLE FUSED GPS PRO</span>' +
                  '<span id="ajBgPill" class="aj-bg-pill">BG GPS STANDBY</span>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:7px;">' +
                  '<button class="aj-layer-btn active" data-mode="dark" onclick="window.__ajSetMapMode(\'dark\')">CYBER DARK</button>' +
                  '<button class="aj-layer-btn" data-mode="sat" onclick="window.__ajSetMapMode(\'sat\')">SATELLITE</button>' +
                  '<button class="aj-layer-btn" data-mode="street" onclick="window.__ajSetMapMode(\'street\')">STREET</button>' +
                  '<button class="aj-layer-btn" data-mode="topo" onclick="window.__ajSetMapMode(\'topo\')">TOPO</button>' +
                '</div>' +
                '<div class="aj-hud-grid">' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">BG DIST</div><div id="ajHudDist" class="aj-hud-val">0.00 km</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">AVG SPD</div><div id="ajHudAvg" class="aj-hud-val">0.0 km/h</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">CLIMB</div><div id="ajHudElev" class="aj-hud-val">+0 m</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">COMPASS</div><div id="ajHudComp" class="aj-hud-val">N 0°</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">HW STEPS</div><div id="ajHudSteps" class="aj-hud-val">0</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">GPS PTS</div><div id="ajHudPts" class="aj-hud-val">0</div></div>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:7px;font-size:10px;color:#8ad8f0;">' +
                  '<span>LAT/LNG: <b id="ajHudCoords">Waiting for lock...</b></span>' +
                  '<div style="display:flex;gap:5px;">' +
                    '<button id="ajTurnOnGpsBtn" onclick="window.AJNative && window.AJNative.openLocationSettings()" style="display:none;padding:3px 8px;border-radius:6px;border:1px solid #ff6e40;background:#4a1400;color:#ffab91;font-size:10px;font-weight:700;">TURN ON GPS</button>' +
                    '<button onclick="if(window.AJNative){if(window.AJNative.isBgGpsRunning()){window.AJNative.stopBgGps();}else{window.__ajSentFirstLock=false;window.AJNative.startBgGps(true);}}" style="padding:3px 8px;border-radius:6px;border:1px solid #00e5ff;background:#00334d;color:#00f0ff;font-size:10px;font-weight:700;">BG ON/OFF</button>' +
                  '</div>' +
                '</div>';

              card.parentElement.insertBefore(hud, card.nextSibling);
              if (window.AJNative && window.AJNative.isBgGpsRunning()) {
                var st = window.AJNative.getBgGpsState();
                if (st) { try { window.__onAJNativeGps(JSON.parse(st)); } catch(e) {} }
              }
            }
            setInterval(mountHud, 900);
          })();
          </script>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload ARISE Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-Pro-Kotlin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
