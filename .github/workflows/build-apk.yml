              private fun updateDailyStreak() {
                  val today = todayKey()
                  val lastDay = prefs.getString("streak_last_day", "") ?: ""
                  var streak = prefs.getInt("streak_days", 0)
                  if (lastDay != today) {
                      val cal = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, -1) }
                      val yesterday = SimpleDateFormat("yyyyMMdd", Locale.US).format(cal.time)
                      streak = if (lastDay == yesterday) streak + 1 else 1
                      prefs.edit().putString("streak_last_day", today).putInt("streak_days", streak).apply()
                  }
              }

