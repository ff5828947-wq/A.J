name: Build ARISE Android 12-16 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate Native ARISE Project (Android 12 - 16)
        run: |
          mkdir -p app/src/main/java/com/aj/system app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ARISESystem"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aj.system"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.aj.system"
                  minSdk = 31
                  targetSdk = 36
                  versionCode = 9
                  versionName = "4.1"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ARISE" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#030812</item>
                  <item name="android:colorBackground">#030812</item>
                  <item name="android:statusBarColor">#030812</item>
                  <item name="android:navigationBarColor">#030812</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="ARISE: Daily Workout Exercise"
                  android:theme="@style/Theme.ARISE"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <service
                      android:name=".LocationService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "logo.png" -o -iname "logo.jpg" -o -iname "logo.jpeg" -o -iname "logo.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/assets/arise_logo.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp "$LOGO_FILE" app/src/main/assets/arise_logo.png
            fi
            sed -i 's/android:label="ARISE: Daily Workout Exercise"/android:label="ARISE: Daily Workout Exercise" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/aj/system/AlarmReceiver.kt
          package com.aj.system

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val label = intent.getStringExtra("label") ?: "DAILY QUEST — ARISE!"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "arise_alarm_channel_v1"
                  val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)

                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ALARM)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()
                  val ch = NotificationChannel(chId, "ARISE Alarms", NotificationManager.IMPORTANCE_HIGH).apply {
                      enableVibration(true)
                      vibrationPattern = longArrayOf(0, 400, 200, 400)
                      setSound(alarmUri, attrs)
                  }
                  nm.createNotificationChannel(ch)

                  val openIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(
                      context, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notif = Notification.Builder(context, chId)
                      .setContentTitle("ARISE SYSTEM ALARM")
                      .setContentText(label)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()

                  nm.notify(1001, notif)
                  try { RingtoneManager.getRingtone(context, alarmUri)?.play() } catch (_: Exception) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/LocationService.kt
          package com.aj.system

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.location.GnssStatus
          import android.location.Location
          import android.location.LocationManager
          import android.os.IBinder
          import android.os.Looper
          import com.google.android.gms.location.FusedLocationProviderClient
          import com.google.android.gms.location.LocationCallback
          import com.google.android.gms.location.LocationRequest
          import com.google.android.gms.location.LocationResult
          import com.google.android.gms.location.LocationServices
          import com.google.android.gms.location.Priority
          import java.util.Locale

          class LocationService : Service() {
              companion object {
                  const val CH_ID = "arise_gps_channel_v1"
                  const val NOTIF_ID = 3001
                  var isRunning = false
                  var totalDistM = 0.0
                  var maxSpeedKmh = 0.0
                  var elevGainM = 0.0
                  var startTimeMs = 0L
                  var pointCount = 0
                  var satUsed = 0
                  var satTotal = 0
                  var latestJson = ""
                  var onLocationUpdate: ((String) -> Unit)? = null
                  var onStatusUpdate: ((String, String) -> Unit)? = null
              }

              private lateinit var lm: LocationManager
              private lateinit var fusedClient: FusedLocationProviderClient
              private var lastLoc: Location? = null
              private var lastNotifMs = 0L

              private val locCallback = object : LocationCallback() {
                  override fun onLocationResult(result: LocationResult) {
                      val loc = result.lastLocation ?: return
                      emitLocation(loc, isCached = false)
                  }
              }

              private val gnssCb = object : GnssStatus.Callback() {
                  override fun onSatelliteStatusChanged(status: GnssStatus) {
                      var used = 0
                      val total = status.satelliteCount
                      for (i in 0 until total) {
                          if (status.usedInFix(i)) used++
                      }
                      satUsed = used
                      satTotal = total
                      if (latestJson.isEmpty()) {
                          onStatusUpdate?.invoke("SEARCHING", "SAT $used/$total • LOCKING...")
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val hasFine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val hasCoarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!hasFine && !hasCoarse) {
                      onStatusUpdate?.invoke("NO_PERM", "ALLOW LOCATION PERMISSION")
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (intent?.getBooleanExtra("reset", false) == true || !isRunning) {
                      totalDistM = 0.0
                      maxSpeedKmh = 0.0
                      elevGainM = 0.0
                      pointCount = 0
                      lastLoc = null
                      startTimeMs = System.currentTimeMillis()
                  }

                  isRunning = true
                  createChannel()
                  val notif = buildNotif("Locking Google Fused GPS...")
                  try {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } catch (e: Exception) {
                      onStatusUpdate?.invoke("ERR", "FG: ${e.message}")
                  }

                  lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  val gpsOn = try { lm.isProviderEnabled(LocationManager.GPS_PROVIDER) } catch (_: Exception) { false }
                  val netOn = try { lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER) } catch (_: Exception) { false }

                  if (!gpsOn && !netOn) {
                      onStatusUpdate?.invoke("GPS_OFF", "TURN ON PHONE LOCATION")
                  } else {
                      onStatusUpdate?.invoke("SEARCHING", "FUSED GPS ACTIVE • LOCKING...")
                  }

                  try {
                      lm.registerGnssStatusCallback(mainExecutor, gnssCb)
                  } catch (_: Exception) {}

                  fusedClient = LocationServices.getFusedLocationProviderClient(this)
                  try {
                      fusedClient.lastLocation.addOnSuccessListener { cached ->
                          if (cached != null) emitLocation(cached, isCached = true)
                      }
                  } catch (_: SecurityException) {}

                  try {
                      val req = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1000L)
                          .setMinUpdateIntervalMillis(500L)
                          .setMinUpdateDistanceMeters(0f)
                          .build()
                      fusedClient.removeLocationUpdates(locCallback)
                      fusedClient.requestLocationUpdates(req, locCallback, Looper.getMainLooper())
                  } catch (_: SecurityException) {}

                  return START_STICKY
              }

              private fun emitLocation(loc: Location, isCached: Boolean) {
                  if (!isCached) {
                      val prev = lastLoc
                      if (prev != null) {
                          val d = prev.distanceTo(loc).toDouble()
                          if (loc.accuracy <= 50f && d >= 1.5 && d <= 150.0) {
                              totalDistM += d
                              if (loc.hasAltitude() && prev.hasAltitude()) {
                                  val dAlt = loc.altitude - prev.altitude
                                  if (dAlt > 1.0 && dAlt < 30.0) elevGainM += dAlt
                              }
                          }
                      }
                      if (loc.accuracy <= 120f) {
                          lastLoc = loc
                          pointCount++
                      }
                  }

                  val speedMs = if (loc.hasSpeed()) loc.speed.toDouble() else 0.0
                  val speedKmh = if (speedMs * 3.6 > 0.3) speedMs * 3.6 else 0.0
                  if (speedKmh > maxSpeedKmh && speedKmh < 150.0) maxSpeedKmh = speedKmh

                  val elapsedSec = ((System.currentTimeMillis() - startTimeMs) / 1000L).coerceAtLeast(1L)
                  val avgSpeedKmh = (totalDistM / elapsedSec.toDouble()) * 3.6
                  val kcal = (totalDistM / 1000.0) * 65.0
                  val steps = (totalDistM / 0.78).toInt()
                  val bearing = if (loc.hasBearing()) loc.bearing.toDouble() else 0.0
                  val alt = if (loc.hasAltitude()) loc.altitude else 0.0

                  val json = String.format(
                      Locale.US,
                      "{\"lat\":%.6f,\"lng\":%.6f,\"acc\":%.1f,\"spd\":%.2f,\"spdMs\":%.2f,\"maxSpd\":%.2f,\"avgSpd\":%.2f,\"alt\":%.1f,\"elevGain\":%.1f,\"bearing\":%.1f,\"distM\":%.1f,\"kcal\":%.1f,\"steps\":%d,\"pts\":%d,\"sec\":%d,\"satU\":%d,\"satT\":%d,\"bg\":true}",
                      loc.latitude, loc.longitude, loc.accuracy, speedKmh, speedMs,
                      maxSpeedKmh, avgSpeedKmh, alt, elevGainM, bearing,
                      totalDistM, kcal, steps, pointCount, elapsedSec, satUsed, satTotal
                  )
                  latestJson = json
                  onLocationUpdate?.invoke(json)

                  val now = System.currentTimeMillis()
                  if (now - lastNotifMs >= 2000L) {
                      lastNotifMs = now
                      val km = totalDistM / 1000.0
                      val mins = elapsedSec / 60
                      val secs = elapsedSec % 60
                      val text = String.format(Locale.US, "%.2f km • %.1f km/h • %02d:%02d • ±%.0fm", km, speedKmh, mins, secs, loc.accuracy)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotif(text))
                  }
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ch = NotificationChannel(CH_ID, "ARISE Real-Time GPS", NotificationManager.IMPORTANCE_LOW)
                  nm.createNotificationChannel(ch)
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 1, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, CH_ID)
                      .setContentTitle("ARISE PRO GPS ACTIVE")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  isRunning = false
                  if (::fusedClient.isInitialized) {
                      try { fusedClient.removeLocationUpdates(locCallback) } catch (_: Exception) {}
                  }
                  if (::lm.isInitialized) {
                      try { lm.unregisterGnssStatusCallback(gnssCb) } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/MainActivity.kt
          package com.aj.system

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.view.View
          import android.view.WindowManager
          import android.webkit.GeolocationPermissions
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.fragment.app.FragmentActivity
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class MainActivity : FragmentActivity(), SensorEventListener {
              companion object {
                  @Volatile
                  var currentMapMode: String = "dark"
              }

              private lateinit var web: WebView
              private lateinit var prefs: SharedPreferences
              private lateinit var sensorManager: SensorManager
              private var stepDetector: Sensor? = null
              private var hasHardwareSteps = false
              private var todaySteps = 0
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var isUnlockedThisSession = false
              private var lastPauseMs = 0L

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  try {
                      @Suppress("DEPRECATION")
                      window.statusBarColor = Color.parseColor("#030812")
                      @Suppress("DEPRECATION")
                      window.navigationBarColor = Color.parseColor("#030812")
                  } catch (_: Exception) {}

                  prefs = getSharedPreferences("arise_pro_prefs", Context.MODE_PRIVATE)
                  loadTodaySteps()
                  setupStepSensor()
                  requestAppPerms()

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#030812"))
                  }

                  web = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#030812"))
                      isVerticalScrollBarEnabled = true
                      overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
                  }
                  root.addView(
                      web,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )
                  setContentView(root)

                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                      val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      v.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      insets
                  }

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                      setGeolocationEnabled(true)
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  web.addJavascriptInterface(AJBridge(this), "AJNative")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val urlStr = request?.url?.toString() ?: return null
                          if (urlStr.contains("carto", ignoreCase = true) ||
                              urlStr.contains("openstreetmap.org", ignoreCase = true) ||
                              urlStr.contains("opentopomap.org", ignoreCase = true) ||
                              urlStr.contains("arcgisonline.com", ignoreCase = true)) {
                              val cleanPath = urlStr.substringBefore("?")
                              val match = Regex("""/(\d+)/(\d+)/(\d+)""").find(cleanPath)
                              if (match != null) {
                                  val z = match.groupValues[1]
                                  val x = match.groupValues[2]
                                  val y = match.groupValues[3]
                                  val targetUrl = when (currentMapMode) {
                                      "sat" -> "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$z/$y/$x"
                                      "street" -> "https://tile.openstreetmap.org/$z/$x/$y.png"
                                      "topo" -> "https://tile.opentopomap.org/$z/$x/$y.png"
                                      else -> "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/$z/$y/$x"
                                  }
                                  try {
                                      val conn = (URL(targetUrl).openConnection() as HttpURLConnection).apply {
                                          connectTimeout = 8000
                                          readTimeout = 8000
                                          setRequestProperty("User-Agent", "ARISESystemApp/4.1 (Android)")
                                      }
                                      if (conn.responseCode == 200) {
                                          val mime = conn.contentType?.substringBefore(";") ?: "image/png"
                                          val headers = mapOf(
                                              "Access-Control-Allow-Origin" to "*",
                                              "Cache-Control" to "no-store, no-cache"
                                          )
                                          return WebResourceResponse(mime, null, 200, "OK", headers, conn.inputStream)
                                      }
                                  } catch (_: Exception) {}
                              }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(origin: String?, cb: GeolocationPermissions.Callback?) {
                          cb?.invoke(origin, true, false)
                      }
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          runOnUiThread { request?.grant(request.resources) }
                      }
                      override fun onShowFileChooser(wv: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try {
                              val i = p?.createIntent()
                              if (i != null) startActivityForResult(i, 99)
                              true
                          } catch (_: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }

                  LocationService.onLocationUpdate = { json ->
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeGps && window.__onAJNativeGps($json);", null)
                      }
                  }
                  LocationService.onStatusUpdate = { code, msg ->
                      val safeMsg = msg.replace("'", "")
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeGpsStatus && window.__onAJNativeGpsStatus('$code','$safeMsg');", null)
                      }
                  }

                  web.loadUrl("file:///android_asset/index.html")
              }

              private fun getVibrator(): Vibrator? {
                  return try {
                      val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vm.defaultVibrator
                  } catch (_: Exception) { null }
              }

              // Hardware-tuned Flagship Soft/Crisp Taptic Haptics (Android 12-16)
              fun triggerHaptic(style: String = "tap") {
                  val mode = prefs.getString("haptic_mode", "soft") ?: "soft"
                  if (mode == "off") return
                  try {
                      val v = getVibrator() ?: return
                      if (!v.hasVibrator()) return
                      val effect = when (style) {
                          "success" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_DOUBLE_CLICK)
                          "heavy" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          else -> if (mode == "crisp") {
                              VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          } else {
                              VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK)
                          }
                      }
                      v.vibrate(effect)
                  } catch (_: Exception) {}
              }

              private fun todayKey(): String = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun loadTodaySteps() {
                  val savedDay = prefs.getString("steps_day", "")
                  val today = todayKey()
                  if (savedDay != today) {
                      todaySteps = 0
                      prefs.edit().putString("steps_day", today).putInt("steps_count", 0).apply()
                  } else {
                      todaySteps = prefs.getInt("steps_count", 0)
                  }
              }

              private fun setupStepSensor() {
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  stepDetector = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)
                  hasHardwareSteps = (stepDetector != null)
              }

              private fun registerStepListener() {
                  val sensor = stepDetector ?: return
                  val hasAct = checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED
                  if (hasAct) {
                      try {
                          sensorManager.unregisterListener(this, sensor)
                          sensorManager.registerListener(this, sensor, SensorManager.SENSOR_DELAY_UI)
                      } catch (_: Exception) {}
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_STEP_DETECTOR) {
                      val today = todayKey()
                      if (prefs.getString("steps_day", "") != today) {
                          todaySteps = 0
                          prefs.edit().putString("steps_day", today).apply()
                      }
                      todaySteps += 1
                      prefs.edit().putInt("steps_count", todaySteps).apply()
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep($todaySteps);", null)
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              fun resetHardwareSteps() {
                  todaySteps = 0
                  prefs.edit().putString("steps_day", todayKey()).putInt("steps_count", 0).apply()
                  runOnUiThread {
                      web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep(0);", null)
                  }
              }

              fun triggerBiometricUnlock(reason: String = "Unlock ARISE System") {
                  runOnUiThread {
                      val bm = BiometricManager.from(this)
                      val authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG or
                              BiometricManager.Authenticators.BIOMETRIC_WEAK or
                              BiometricManager.Authenticators.DEVICE_CREDENTIAL
                      if (bm.canAuthenticate(authenticators) != BiometricManager.BIOMETRIC_SUCCESS) {
                          isUnlockedThisSession = true
                          web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Device lock not set');", null)
                          return@runOnUiThread
                      }
                      val executor = ContextCompat.getMainExecutor(this)
                      val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                              super.onAuthenticationSucceeded(result)
                              isUnlockedThisSession = true
                              triggerHaptic("success")
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Verified');", null)
                          }
                          override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                              super.onAuthenticationError(errorCode, errString)
                              val msg = errString.toString().replace("'", "")
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(false, '$msg');", null)
                          }
                          override fun onAuthenticationFailed() {
                              super.onAuthenticationFailed()
                              triggerHaptic("heavy")
                          }
                      })
                      val info = BiometricPrompt.PromptInfo.Builder()
                          .setTitle("ARISE SECURITY")
                          .setSubtitle(reason)
                          .setAllowedAuthenticators(authenticators)
                          .build()
                      try { prompt.authenticate(info) } catch (_: Exception) {}
                  }
              }

              override fun onPause() {
                  super.onPause()
                  lastPauseMs = System.currentTimeMillis()
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  registerStepListener()
                  web.evaluateJavascript("window.__ajResumeAudio && window.__ajResumeAudio();", null)
                  web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep($todaySteps);", null)
                  web.evaluateJavascript("window.__ariseRefreshPro && window.__ariseRefreshPro();", null)

                  val lockEnabled = prefs.getBoolean("bio_lock_on", false)
                  if (lockEnabled && (!isUnlockedThisSession || (lastPauseMs > 0 && System.currentTimeMillis() - lastPauseMs > 12000L))) {
                      isUnlockedThisSession = false
                      web.evaluateJavascript("window.__ajShowLockScreen && window.__ajShowLockScreen();", null)
                  }

                  if (LocationService.isRunning) {
                      val i = Intent(this, LocationService::class.java).apply { putExtra("reset", false) }
                      startForegroundService(i)
                  }
                  if (LocationService.latestJson.isNotEmpty()) {
                      web.evaluateJavascript("window.__onAJNativeGps && window.__onAJNativeGps(${LocationService.latestJson});", null)
                  }
              }

              override fun onDestroy() {
                  LocationService.onLocationUpdate = null
                  LocationService.onStatusUpdate = null
                  try { sensorManager.unregisterListener(this) } catch (_: Exception) {}
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.destroy()
                  super.onDestroy()
              }

              fun clearWebCache() {
                  runOnUiThread { web.clearCache(true) }
              }

              fun requestAppPerms() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.ACTIVITY_RECOGNITION
                  )
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val need = perms.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 101)
              }

              fun openAppPermissionSettings() {
                  try {
                      Toast.makeText(this, "Tap Permissions → Location → Allow all the time", Toast.LENGTH_LONG).show()
                      val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(i)
                  } catch (_: Exception) {}
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101) {
                      registerStepListener()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 99) {
                      val res = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      fileCb?.onReceiveValue(res)
                      fileCb = null
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              class AJBridge(private val act: MainActivity) {
                  @JavascriptInterface fun setMapMode(mode: String) { currentMapMode = mode; act.clearWebCache() }
                  @JavascriptInterface fun haptic(style: String) { act.triggerHaptic(style) }
                  @JavascriptInterface fun getHapticMode(): String = act.prefs.getString("haptic_mode", "soft") ?: "soft"
                  @JavascriptInterface fun cycleHapticMode(): String {
                      val cur = getHapticMode()
                      val next = when (cur) {
                          "soft" -> "crisp"
                          "crisp" -> "off"
                          else -> "soft"
                      }
                      act.prefs.edit().putString("haptic_mode", next).apply()
                      if (next != "off") act.triggerHaptic("tap")
                      return next
                  }

                  @JavascriptInterface fun getSteps(): Int = act.todaySteps
                  @JavascriptInterface fun hasHardwareSteps(): Boolean = act.hasHardwareSteps
                  @JavascriptInterface fun resetSteps() { act.resetHardwareSteps(); act.triggerHaptic("heavy") }

                  @JavascriptInterface fun isBioLockEnabled(): Boolean = act.prefs.getBoolean("bio_lock_on", false)
                  @JavascriptInterface fun setBioLockEnabled(on: Boolean) {
                      act.prefs.edit().putBoolean("bio_lock_on", on).apply()
                      if (on) act.isUnlockedThisSession = true
                      act.triggerHaptic("tap")
                  }
                  @JavascriptInterface fun triggerBiometric(reason: String) { act.triggerBiometricUnlock(reason) }

                  @JavascriptInterface fun isIntroEnabled(): Boolean = act.prefs.getBoolean("intro_on", true)
                  @JavascriptInterface fun setIntroEnabled(on: Boolean) {
                      act.prefs.edit().putBoolean("intro_on", on).apply()
                      act.triggerHaptic("tap")
                  }

                  @JavascriptInterface fun hasBackgroundLocation(): Boolean {
                      return act.checkSelfPermission(Manifest.permission.ACCESS_BACKGROUND_LOCATION) == PackageManager.PERMISSION_GRANTED
                  }

                  @JavascriptInterface fun requestBackgroundLocation() {
                      act.triggerHaptic("tap")
                      act.runOnUiThread { act.openAppPermissionSettings() }
                  }

                  @JavascriptInterface fun openLocationSettings() {
                      try {
                          val i = Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }
                          act.startActivity(i)
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface fun startBgGps(reset: Boolean) {
                      val hasLoc = act.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                                   act.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                      if (!hasLoc) {
                          LocationService.onStatusUpdate?.invoke("NO_PERM", "ALLOW LOCATION PERMISSION")
                          act.runOnUiThread { act.requestAppPerms() }
                          return
                      }
                      val i = Intent(act, LocationService::class.java).apply { putExtra("reset", reset) }
                      act.startForegroundService(i)
                      act.triggerHaptic("success")
                  }

                  @JavascriptInterface fun stopBgGps() {
                      act.stopService(Intent(act, LocationService::class.java))
                      LocationService.onStatusUpdate?.invoke("STOPPED", "BG GPS STOPPED")
                      act.triggerHaptic("tap")
                  }

                  @JavascriptInterface fun getBgGpsState(): String = LocationService.latestJson
                  @JavascriptInterface fun isBgGpsRunning(): Boolean = LocationService.isRunning

                  @JavascriptInterface fun scheduleAlarm(hour: Int, minute: Int, label: String) {
                      val am = act.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(act, AlarmReceiver::class.java).apply { putExtra("label", label) }
                      val pi = PendingIntent.getBroadcast(act, 777, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, hour)
                          set(Calendar.MINUTE, minute)
                          set(Calendar.SECOND, 0)
                          if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                      }
                      try {
                          if (!am.canScheduleExactAlarms()) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          } else {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          }
                      } catch (_: Exception) {
                          am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      }
                  }

                  @JavascriptInterface fun cancelAlarm() {
                      val am = act.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(act, 777, Intent(act, AlarmReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(pi)
                  }

                  @JavascriptInterface fun showNotif(title: String, msg: String) {
                      val nm = act.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val chId = "arise_alerts_v1"
                      nm.createNotificationChannel(NotificationChannel(chId, "ARISE Alerts", NotificationManager.IMPORTANCE_HIGH))
                      val b = Notification.Builder(act, chId)
                      nm.notify(2002, b.setContentTitle(title).setContentText(msg).setSmallIcon(android.R.drawable.ic_dialog_info).build())
                  }
              }
          }
