            window.__ajSetMapMode = function(mode) {
              realMapMode = mode;
              document.querySelectorAll('.aj-layer-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-mode') === mode);
              });
              var tag = document.getElementById('ajRealMapTag');
              if (tag) {
                var labels = { hybrid: '🗺️ GOOGLE HYBRID', road: '🗺️ GOOGLE ROAD', terrain: '🗺️ GOOGLE TERRAIN', dark: '🗺️ CYBER DARK' };
                tag.textContent = labels[mode] || '🗺️ GOOGLE MAPS';
              }
              drawRealLiveMap();
            };

            function degToCompass(deg) {
              var dirs = ['N','NE','E','SE','S','SW','W','NW'];
              return dirs[Math.round(((deg % 360) / 45)) % 8] + ' ' + Math.round(deg) + '°';
            }

            window.__onAJNativeGpsStatus = function(code, msg) {
              var pill = document.getElementById('ajBgPill');
              var locBtn = document.getElementById('ajTurnOnGpsBtn');
              var strip = document.getElementById('ariseLiveGpsStrip');
              if (code === 'STOPPED' && strip) strip.classList.remove('active');
              if (pill) {
                pill.textContent = msg;
                pill.classList.remove('live', 'err');
                if (code === 'GPS_OFF' || code === 'NO_PERM' || code === 'ERR') pill.classList.add('err');
              }
              if (locBtn) locBtn.style.display = (code === 'GPS_OFF') ? 'inline-block' : 'none';
            };

            window.__onAJNativeGps = function(d) {
              if (window.__ajToGeoPos && window.__ajGpsWatchers) {
                var isFirst = !window.__ajSentFirstLock;
                if (isFirst || d.acc <= 75) {
                  window.__ajSentFirstLock = true;
                  var pos = window.__ajToGeoPos(d, isFirst);
                  Object.keys(window.__ajGpsWatchers).forEach(function(k) {
                    try { window.__ajGpsWatchers[k](pos); } catch(e) {}
                  });
                }
              }
              realMapLat = d.lat;
              realMapLng = d.lng;
              realMapAcc = d.acc || 15;
              if (mapFollowUser) {
                mapViewLat = d.lat;
                mapViewLng = d.lng;
              }
              var lastP = realMapPath[realMapPath.length - 1];
              if (!lastP || Math.abs(lastP.lat - d.lat) > 0.00003 || Math.abs(lastP.lng - d.lng) > 0.00003) {
                realMapPath.push({ lat: d.lat, lng: d.lng });
                if (realMapPath.length > 600) realMapPath.shift();
              }
              drawRealLiveMap();

              var strip = document.getElementById('ariseLiveGpsStrip');
              if (strip) {
                strip.classList.add('active');
                var sl = document.getElementById('ariseStripLeft');
                var sr = document.getElementById('ariseStripRight');
                var m = String(Math.floor((d.sec || 0) / 60)).padStart(2, '0');
                var s = String((d.sec || 0) % 60).padStart(2, '0');
                if (sl) sl.textContent = '🟢 GPS LIVE • ' + (d.distM / 1000).toFixed(2) + ' km • ' + (d.spd || 0).toFixed(1) + ' km/h';
                if (sr) sr.textContent = m + ':' + s + ' • ±' + Math.round(d.acc) + 'm';
              }
              var pill = document.getElementById('ajBgPill');
              var locBtn = document.getElementById('ajTurnOnGpsBtn');
              if (locBtn) locBtn.style.display = 'none';
              if (pill) {
                pill.textContent = 'LIVE • ±' + Math.round(d.acc) + 'm • SAT ' + (d.satU || 0) + '/' + (d.satT || 0);
                pill.classList.remove('err');
                pill.classList.add('live');
              }
              var paceStr = '--';
              if (d.avgSpd > 0.8) {
                var pMin = 60 / d.avgSpd;
                var pm = Math.floor(pMin), ps = Math.round((pMin - pm) * 60);
                paceStr = pm + ':' + String(ps).padStart(2, '0');
              }
              var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
              set('ajHudDist', (d.distM / 1000).toFixed(2) + ' km');
              set('ajHudAvg', d.avgSpd.toFixed(1) + ' km/h');
              set('ajHudPace', paceStr);
              set('ajHudKcal', Math.round(d.kcal || 0) + ' kcal');
              set('ajHudElev', '+' + Math.round(d.elevGain) + ' m');
              set('ajHudComp', degToCompass(d.bearing));
              set('ajHudSteps', String(latestHwSteps || d.steps));
              set('ajHudPts', String(d.pts));
              set('ajHudCoords', d.lat.toFixed(5) + ', ' + d.lng.toFixed(5));
            };

            function mountGpsHud() {
              if (document.getElementById('ajProGpsHud')) {
                bindRealMapTouch(document.getElementById('ajRealMapCanvas'));
                drawRealLiveMap();
                return;
              }
              var proBtn = Array.from(document.querySelectorAll('button')).find(function(b) {
                return (b.textContent || '').toUpperCase().indexOf('PRO GPS') !== -1;
              });
              if (!proBtn) return;

              var card = proBtn.parentElement;
              while (card && card.parentElement && card.textContent.toUpperCase().indexOf('PRO ROUTE') === -1) {
                card = card.parentElement;
              }
              if (!card || !card.parentElement) return;

              var hud = document.createElement('div');
              hud.id = 'ajProGpsHud';
              hud.innerHTML =
                '<div class="aj-hud-row">' +
                  '<span style="font-size:11px;font-weight:800;color:#00f7ff;">⚡ GOOGLE FUSED GPS PRO</span>' +
                  '<span id="ajBgPill" class="aj-bg-pill">BG GPS STANDBY</span>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:8px;">' +
                  '<button class="aj-layer-btn active" data-mode="hybrid" onclick="window.__ajSetMapMode(\'hybrid\')">G-HYBRID</button>' +
                  '<button class="aj-layer-btn" data-mode="road" onclick="window.__ajSetMapMode(\'road\')">G-ROAD</button>' +
                  '<button class="aj-layer-btn" data-mode="terrain" onclick="window.__ajSetMapMode(\'terrain\')">G-TERRAIN</button>' +
                  '<button class="aj-layer-btn" data-mode="dark" onclick="window.__ajSetMapMode(\'dark\')">CYBER DARK</button>' +
                '</div>' +
                '<div id="ajRealMapWrap">' +
                  '<canvas id="ajRealMapCanvas"></canvas>' +
                  '<div id="ajRealMapTag" class="aj-map-tag">🗺️ GOOGLE HYBRID</div>' +
                  '<div class="aj-map-ctrl">' +
                    '<button class="aj-map-btn" onclick="window.__ajZoomRealMap(1)">+</button>' +
                    '<button class="aj-map-btn" onclick="window.__ajZoomRealMap(-1)">−</button>' +
                    '<button class="aj-map-btn" onclick="window.__ajRecenterRealMap()">🎯</button>' +
                  '</div>' +
                '</div>' +
                '<div class="aj-hud-grid">' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">BG DIST</div><div id="ajHudDist" class="aj-hud-val">0.00 km</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">AVG SPD</div><div id="ajHudAvg" class="aj-hud-val">0.0 km/h</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">PACE</div><div id="ajHudPace" class="aj-hud-val">--</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">BURN</div><div id="ajHudKcal" class="aj-hud-val">0 kcal</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">CLIMB</div><div id="ajHudElev" class="aj-hud-val">+0 m</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">COMPASS</div><div id="ajHudComp" class="aj-hud-val">N 0°</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">HW STEPS</div><div id="ajHudSteps" class="aj-hud-val">0</div></div>' +
                  '<div class="aj-hud-box"><div class="aj-hud-lbl">GPS PTS</div><div id="ajHudPts" class="aj-hud-val">0</div></div>' +
                '</div>' +
                '<div class="aj-hud-row" style="margin-top:8px;font-size:10px;color:#8ad8f0;">' +
                  '<span>LAT/LNG: <b id="ajHudCoords">Waiting for lock...</b></span>' +
                  '<div style="display:flex;gap:5px;">' +
                    '<button id="ajTurnOnGpsBtn" onclick="window.AJNative && window.AJNative.openLocationSettings()" style="display:none;padding:4px 9px;border-radius:6px;border:1px solid #ff6e40;background:#4a1400;color:#ffab91;font-size:10px;font-weight:800;">TURN ON GPS</button>' +
                    '<button onclick="if(window.AJNative){if(window.AJNative.isBgGpsRunning()){window.AJNative.stopBgGps();}else{window.__ajSentFirstLock=false;window.AJNative.startBgGps(true);}}" style="padding:4px 9px;border-radius:6px;border:1px solid #00f0ff;background:#00334d;color:#00f7ff;font-size:10px;font-weight:800;">BG ON/OFF</button>' +
                  '</div>' +
                '</div>';

              card.parentElement.insertBefore(hud, card.nextSibling);
              bindRealMapTouch(document.getElementById('ajRealMapCanvas'));
              if (window.AJNative && window.AJNative.isBgGpsRunning()) {
                var st = window.AJNative.getBgGpsState();
                if (st) { try { window.__onAJNativeGps(JSON.parse(st)); } catch(e) {} }
              }
              drawRealLiveMap();
            }

            setTimeout(scheduleUiSync, 500);
            setTimeout(scheduleUiSync, 2100);
          })();
          </script>
          EOF

      - name: Setup Release Signing Keystore
        env:
          ARISE_KEYSTORE_B64: ${{ secrets.ARISE_KEYSTORE_B64 }}
          ARISE_STORE_PASS: ${{ secrets.ARISE_STORE_PASS }}
          ARISE_KEY_ALIAS: ${{ secrets.ARISE_KEY_ALIAS }}
          ARISE_KEY_PASS: ${{ secrets.ARISE_KEY_PASS }}
        run: |
          STORE_PASS="${ARISE_STORE_PASS:-Arise@2026Pro}"
          KEY_ALIAS="${ARISE_KEY_ALIAS:-arisekey}"
          KEY_PASS="${ARISE_KEY_PASS:-Arise@2026Pro}"
          if [ -n "$ARISE_KEYSTORE_B64" ]; then
            echo "$ARISE_KEYSTORE_B64" | base64 -d > app/arise-release.jks
            echo "Using saved GitHub Secret keystore."
          else
            keytool -genkeypair -v \
              -keystore app/arise-release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=ARISE Fitness, OU=Mobile, O=ARISE, L=India, S=IN, C=IN"
            cp app/arise-release.jks keystore-backup/arise-release.jks
            base64 -w 0 app/arise-release.jks > keystore-backup/ARISE_KEYSTORE_B64.txt
            echo "NEW_KEY_CREATED=true" >> $GITHUB_ENV
          fi

      - name: Build Signed Release AAB & APK
        env:
          ARISE_STORE_PASS: ${{ secrets.ARISE_STORE_PASS }}
          ARISE_KEY_ALIAS: ${{ secrets.ARISE_KEY_ALIAS }}
          ARISE_KEY_PASS: ${{ secrets.ARISE_KEY_PASS }}
        run: gradle bundleRelease assembleRelease

      - name: Upload Play Store Signed AAB & Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-PlayStore-Signed-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore Backup (SAVE TO GOOGLE DRIVE!)
        if: env.NEW_KEY_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-KEYSTORE-BACKUP-KEEP-SAFE
          path: keystore-backup/
