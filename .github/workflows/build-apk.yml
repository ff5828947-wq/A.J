          class MainActivity : FragmentActivity(), SensorEventListener, TextToSpeech.OnInitListener, PurchasesUpdatedListener {
              companion object {
                  @Volatile
                  var currentMapMode: String = "dark"
                  const val VIP_PRODUCT_ID = "arise_vip_monthly"
              }

              private lateinit var web: WebView
              private lateinit var nativeSplash: FrameLayout
              private lateinit var prefs: SharedPreferences
              private lateinit var sensorManager: SensorManager
              private var stepDetector: Sensor? = null
