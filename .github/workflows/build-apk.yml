name: Build ARISE Play Store Signed AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate ARISE Ultra Pro Max v1.2.0 Project (Android 12 - 16)
        run: |
          mkdir -p app/src/main/java/com/aj/system app/src/main/assets app/src/main/res/values keystore-backup

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ARISESystem"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aj.system"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.arise.dailyworkout.pro"
                  minSdk = 31
                  targetSdk = 36
                  versionCode = 3
                  versionName = "1.2.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("arise-release.jks")
                      storePassword = System.getenv("ARISE_STORE_PASS").orEmpty().ifBlank { "Arise@2026Pro" }
                      keyAlias = System.getenv("ARISE_KEY_ALIAS").orEmpty().ifBlank { "arisekey" }
                      keyPassword = System.getenv("ARISE_KEY_PASS").orEmpty().ifBlank { "Arise@2026Pro" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.android.gms:play-services-location:21.3.0")
              implementation("com.android.billingclient:billing-ktx:7.1.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ARISE" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#030812</item>
                  <item name="android:colorBackground">#030812</item>
                  <item name="android:statusBarColor">#030812</item>
                  <item name="android:navigationBarColor">#030812</item>
                  <item name="android:windowSplashScreenBackground">#030812</item>
                  <item name="android:windowSplashScreenAnimationDuration">200</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
