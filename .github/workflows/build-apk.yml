              .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
              .theme-chip {
                padding: 9px 6px; border-radius: 10px; border: 1.5px solid var(--accent-border);
                background: var(--card-inner); color: var(--text-main); font-size: 10.5px; font-weight: 900; cursor: pointer;
              }
              .theme-chip.active { background: var(--accent); color: #040812; border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }

              .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
              .cal-day {
                aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--accent-border);
