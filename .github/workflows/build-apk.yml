          <script>
          (function(){
            var allThemeClasses = [
              'vip-theme-gold','vip-theme-crimson','vip-theme-emerald','vip-theme-amethyst','vip-theme-frost',
              'arise-theme-gold','arise-theme-red','arise-theme-green','arise-theme-violet','arise-theme-pink','arise-theme-dark','arise-theme-light'
            ];
            var rgbIv = null;
            var rgbDeg = 0;
            var currentLiveTheme = 'cyan';
            var toastT = 0;

            function showToast(msg) {
              var el = document.getElementById('ariseToast');
              if (!el && document.body) {
                el = document.createElement('div');
                el.id = 'ariseToast';
