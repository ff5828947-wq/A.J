name: Build ARISE Daily Workout v2.0 Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate ARISE v2.0 Android Project
        run: |
          mkdir -p app/src/main/java/com/arise/workout app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AriseWorkout"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.arise.workout"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.arise.daily.workout"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 20
                  versionName = "2.0.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("arise-release.jks")
                      storePassword = System.getenv("ARISE_STORE_PASS").orEmpty().ifBlank { "Arise@2026" }
                      keyAlias = System.getenv("ARISE_KEY_ALIAS").orEmpty().ifBlank { "arisekey" }
                      keyPassword = System.getenv("ARISE_KEY_PASS").orEmpty().ifBlank { "Arise@2026" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AriseWorkout" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#060a14</item>
                  <item name="android:colorBackground">#060a14</item>
                  <item name="android:statusBarColor">#060a14</item>
                  <item name="android:navigationBarColor">#060a14</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="ARISE: Daily Workout"
                  android:theme="@style/Theme.AriseWorkout"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "arise*.png" -o -iname "logo*.png" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="ARISE: Daily Workout"/android:label="ARISE: Daily Workout" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/arise/workout/MainActivity.kt
          package com.arise.workout

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.*
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity(), SensorEventListener {
              private lateinit var webView: WebView
              private var sensorManager: SensorManager? = null
              private var stepSensor: Sensor? = null
              private var baseSteps = -1f
              private var sessionSteps = 0

              inner class NativeBridge {
                  @JavascriptInterface
                  fun sendTestNotification(title: String, msg: String) {
                      runOnUiThread {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val chId = "arise_quest_alerts"
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              nm.createNotificationChannel(
                                  NotificationChannel(chId, "ARISE Quest Alerts", NotificationManager.IMPORTANCE_DEFAULT)
                              )
                          }
                          val icon = applicationInfo.icon.takeIf { it != 0 } ?: android.R.drawable.sym_def_app_icon
                          val n = NotificationCompat.Builder(this@MainActivity, chId)
                              .setSmallIcon(icon)
                              .setContentTitle(title)
                              .setContentText(msg)
                              .setAutoCancel(true)
                              .build()
                          nm.notify(4001, n)
                          Toast.makeText(this@MainActivity, "Alert Sent!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  @JavascriptInterface
                  fun getHwSteps(): Int = sessionSteps

                  @JavascriptInterface
                  fun resetHwSteps() {
                      baseSteps = -1f
                      sessionSteps = 0
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  requestNeededPermissions()

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  stepSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#060a14"))
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          mediaPlaybackRequiresUserGesture = false
                          setGeolocationEnabled(true)
                          cacheMode = WebSettings.LOAD_DEFAULT
                      }
                      addJavascriptInterface(NativeBridge(), "AriseNative")
                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              runOnUiThread { request.grant(request.resources) }
                          }
                          override fun onGeolocationPermissionsShowPrompt(
                              origin: String,
                              callback: GeolocationPermissions.Callback
                          ) {
                              callback.invoke(origin, true, false)
                          }
                      }
                  }
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun requestNeededPermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      perms.add(Manifest.permission.ACTIVITY_RECOGNITION)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 202)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  stepSensor?.let { sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                  webView.onResume()
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager?.unregisterListener(this)
                  webView.onPause()
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_STEP_COUNTER) {
                      val v = event.values[0]
                      if (baseSteps < 0f) baseSteps = v
                      sessionSteps = (v - baseSteps).toInt().coerceAtLeast(0)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
          EOF

          cat << 'ARISEHTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en" data-theme="cyan">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>ARISE: Daily Workout v2.0</title>
            <style>
              /* 100% REACTIVE THEME VARIABLES (ALL 9 THEMES WORK INSTANTLY!) */
              :root {
                --accent: #00e5ff;
                --accent2: #0095ff;
                --accent-soft: rgba(0, 229, 255, 0.16);
                --accent-border: rgba(0, 229, 255, 0.42);
                --accent-glow: rgba(0, 229, 255, 0.35);
                --bg-main: #060a14;
                --bg-grad: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.12), #060a14 68%);
                --card-bg: rgba(12, 18, 32, 0.92);
                --card-inner: rgba(255, 255, 255, 0.04);
                --text-main: #eef6ff;
                --text-muted: #8ca4bf;
                --good: #22e58b;
                --warn: #ffb838;
                --danger: #ff3b5c;
              }

              [data-theme="cyan"]   { --accent: #00e5ff; --accent2: #0088ff; --accent-soft: rgba(0,229,255,0.16);  --accent-border: rgba(0,229,255,0.45);  --accent-glow: rgba(0,229,255,0.35);  --bg-grad: radial-gradient(circle at 50% 0%, rgba(0,229,255,0.14), #060a14 68%); }
              [data-theme="violet"] { --accent: #b855ff; --accent2: #7b2cff; --accent-soft: rgba(184,85,255,0.18); --accent-border: rgba(184,85,255,0.48); --accent-glow: rgba(184,85,255,0.38); --bg-grad: radial-gradient(circle at 50% 0%, rgba(160,60,255,0.16), #090614 68%); }
              [data-theme="red"]    { --accent: #ff2e55; --accent2: #d90429; --accent-soft: rgba(255,46,85,0.18);  --accent-border: rgba(255,46,85,0.48);  --accent-glow: rgba(255,46,85,0.38);  --bg-grad: radial-gradient(circle at 50% 0%, rgba(255,46,85,0.15), #12060a 68%); }
              [data-theme="green"]  { --accent: #22f57a; --accent2: #0ea854; --accent-soft: rgba(34,245,122,0.16); --accent-border: rgba(34,245,122,0.45); --accent-glow: rgba(34,245,122,0.35); --bg-grad: radial-gradient(circle at 50% 0%, rgba(34,245,122,0.14), #05110a 68%); }
              [data-theme="pink"]   { --accent: #ff4fd8; --accent2: #d926a9; --accent-soft: rgba(255,79,216,0.18); --accent-border: rgba(255,79,216,0.48); --accent-glow: rgba(255,79,216,0.38); --bg-grad: radial-gradient(circle at 50% 0%, rgba(255,79,216,0.15), #130612 68%); }
              [data-theme="gold"]   { --accent: #ffc838; --accent2: #e08e00; --accent-soft: rgba(255,200,56,0.18); --accent-border: rgba(255,200,56,0.48); --accent-glow: rgba(255,200,56,0.36); --bg-grad: radial-gradient(circle at 50% 0%, rgba(255,200,56,0.15), #120e05 68%); }
              [data-theme="dark"]   { --accent: #d4e0f0; --accent2: #8a9bb5; --accent-soft: rgba(212,224,240,0.14);--accent-border: rgba(212,224,240,0.34);--accent-glow: rgba(212,224,240,0.22);--bg-main: #050608; --bg-grad: linear-gradient(180deg, #0b0d12, #040507); --card-bg: rgba(16,18,24,0.95); }
              [data-theme="light"]  {
                --accent: #0066ff; --accent2: #0044cc;
                --accent-soft: rgba(0,102,255,0.12); --accent-border: rgba(0,102,255,0.35); --accent-glow: rgba(0,102,255,0.22);
                --bg-main: #eef3fa; --bg-grad: linear-gradient(180deg, #f5f8fd, #e3ebf6);
                --card-bg: rgba(255,255,255,0.94); --card-inner: rgba(0,25,65,0.05);
                --text-main: #0f172a; --text-muted: #526582;
              }

              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
              html, body {
                width: 100%; height: 100%; overflow: hidden;
                background: var(--bg-main); background-image: var(--bg-grad);
                color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                transition: background-color 0.25s ease, color 0.25s ease;
              }
              button, input, select { font-family: inherit; touch-action: manipulation; }

              #splash {
                position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 14px; padding: 24px;
                background: radial-gradient(circle at 50% 42%, var(--accent-soft), #04070f 72%);
                transition: opacity 0.35s ease;
              }
              #splash.hide { opacity: 0; pointer-events: none; }
              .sp-ring {
                width: 120px; height: 120px; border-radius: 50%;
                border: 3px solid var(--accent); box-shadow: 0 0 36px var(--accent-glow), inset 0 0 24px var(--accent-glow);
                display: flex; align-items: center; justify-content: center; font-size: 46px;
                animation: spinGlow 2.4s ease-in-out infinite;
              }
              @keyframes spinGlow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
              .sp-title { font-size: 36px; font-weight: 900; letter-spacing: 8px; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
              .sp-sub { font-size: 11px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; }
              .sp-skip { position: absolute; top: 18px; right: 18px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--accent-border); background: var(--card-bg); color: var(--accent); font-size: 11px; font-weight: 800; cursor: pointer; }

              #appShell { display: flex; flex-direction: column; height: 100%; width: 100%; }
              #topHeader {
                flex-shrink: 0; padding: 12px 14px 10px;
                background: var(--card-bg); border-bottom: 1.5px solid var(--accent-border);
                box-shadow: 0 4px 18px rgba(0,0,0,0.28);
              }
              .hdr-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
              .brand-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
              .rank-pill {
                padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--accent);
                background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: 1px;
              }
              .xp-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 10px; font-weight: 800; color: var(--text-muted); }
              .xp-bar { flex: 1; height: 7px; border-radius: 999px; background: var(--card-inner); border: 1px solid var(--accent-border); overflow: hidden; }
              .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.25s ease; }

              #navBar {
                flex-shrink: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
                padding: 7px 8px; background: var(--card-bg); border-bottom: 1px solid var(--accent-border);
              }
              .nav-btn {
                padding: 7px 2px; border-radius: 10px; border: 1px solid transparent;
                background: transparent; color: var(--text-muted);
                display: flex; flex-direction: column; align-items: center; gap: 3px;
                font-size: 9px; font-weight: 900; letter-spacing: 0.6px; cursor: pointer;
              }
              .nav-btn .ico { font-size: 15px; }
              .nav-btn.active {
                background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
                box-shadow: 0 0 12px var(--accent-glow);
              }

              #mainScroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 28px; }
              .pane { display: none; flex-direction: column; gap: 12px; }
              .pane.active { display: flex; }

              .card {
                background: var(--card-bg); border: 1.5px solid var(--accent-border);
                border-radius: 14px; padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.22);
              }
              .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
              .card-title { font-size: 12px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); }
              .badge { font-size: 9.5px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-border); color: var(--accent); }

              .btn {
                border: 1.5px solid var(--accent-border); border-radius: 10px; padding: 10px 12px;
                background: var(--accent-soft); color: var(--text-main);
                font-size: 11px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer;
              }
              .btn:active { transform: scale(0.96); }
              .btn-solid {
                background: linear-gradient(135deg, var(--accent), var(--accent2));
                color: #040812; border-color: var(--accent); box-shadow: 0 4px 14px var(--accent-glow);
              }
              .btn-good { background: rgba(34,229,139,0.2); border-color: var(--good); color: var(--good); }
              .btn-danger { background: rgba(255,59,92,0.18); border-color: var(--danger); color: var(--danger); }
              .btn-sm { padding: 6px 10px; font-size: 10.5px; border-radius: 8px; }

              .ex-card {
                background: var(--card-inner); border: 1px solid var(--accent-border);
                border-radius: 12px; padding: 10px; margin-bottom: 9px;
              }
              .ex-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
              .ex-name { font-size: 13px; font-weight: 900; letter-spacing: 0.8px; }
              .ex-val { font-size: 12px; font-weight: 900; color: var(--accent); }
              .prog-track { width: 100%; height: 7px; border-radius: 999px; background: rgba(128,128,128,0.2); overflow: hidden; margin-bottom: 8px; }
              .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.2s; }
              .man-bar { display: flex; gap: 6px; align-items: center; }
              .man-bar .btn { flex: 1; padding: 7px 4px; font-size: 11px; }

              .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
              .mode-tab {
                padding: 8px 4px; border-radius: 10px; border: 1.5px solid var(--accent-border);
                background: var(--card-inner); color: var(--text-muted); font-size: 10px; font-weight: 900; cursor: pointer;
              }
              .mode-tab.active { background: var(--accent); color: #040812; border-color: var(--accent); }

              .cam-box {
                position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
                background: #02040a; border: 2px solid var(--accent-border); margin-bottom: 10px;
              }
              #camVideo, #camOverlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
              .cam-hud {
                position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none;
              }
              .cam-pill { padding: 4px 8px; border-radius: 7px; background: rgba(0,0,0,0.72); border: 1px solid var(--accent); color: #fff; font-size: 10px; font-weight: 900; }
              .cam-status {
                position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
                padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,0.78);
                border: 1px solid var(--accent); color: var(--accent); font-size: 10.5px; font-weight: 900; white-space: nowrap;
              }

              .manual-pad-btn {
                width: 100%; height: 150px; border-radius: 16px;
                border: 2.5px solid var(--accent);
                background: radial-gradient(circle at 50% 40%, var(--accent-soft), rgba(0,0,0,0.35));
                box-shadow: 0 0 24px var(--accent-glow);
                color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                cursor: pointer; margin-bottom: 10px;
              }
              .manual-pad-btn:active { transform: scale(0.96); background: var(--accent-soft); }
              .manual-big-num { font-size: 46px; font-weight: 900; color: var(--accent); line-height: 1; }

              .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
              .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
              .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
              .stat-tile { background: var(--card-inner); border: 1px solid var(--accent-border); border-radius: 10px; padding: 9px 6px; text-align: center; }
