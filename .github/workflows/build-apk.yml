              private fun getVibrator(): Vibrator? {
                  return try {
                      val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vm.defaultVibrator
                  } catch (_: Exception) { null }
              }

              fun triggerHaptic(style: String = "tap") {
                  val mode = prefs.getString("haptic_mode", "soft") ?: "soft"
                  if (mode == "off") return
                  try {
                      val v = getVibrator() ?: return
                      if (!v.hasVibrator()) return
                      val effect = when (style) {
                          "success" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_DOUBLE_CLICK)
                          "heavy" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          else -> if (mode == "crisp") {
                              VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          } else {
                              VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK)
                          }
                      }
                      v.vibrate(effect)
                  } catch (_: Exception) {}
              }

              private fun todayKey(): String = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun loadTodaySteps() {
                  val savedDay = prefs.getString("steps_day", "")
                  val today = todayKey()
                  if (savedDay != today) {
                      todaySteps = 0
                      prefs.edit().putString("steps_day", today).putInt("steps_count", 0).apply()
                  } else {
                      todaySteps = prefs.getInt("steps_count", 0)
                  }
              }

              private fun setupStepSensor() {
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  stepDetector = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)
                  hasHardwareSteps = (stepDetector != null)
              }

              private fun registerStepListener() {
                  val sensor = stepDetector ?: return
                  val hasAct = checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED
                  if (hasAct) {
                      try {
                          sensorManager.unregisterListener(this, sensor)
                          sensorManager.registerListener(this, sensor, SensorManager.SENSOR_DELAY_UI)
                      } catch (_: Exception) {}
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_STEP_DETECTOR) {
                      val today = todayKey()
                      if (prefs.getString("steps_day", "") != today) {
                          todaySteps = 0
                          prefs.edit().putString("steps_day", today).apply()
                      }
                      todaySteps += 1
                      prefs.edit().putInt("steps_count", todaySteps).apply()
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep($todaySteps);", null)
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              fun resetHardwareSteps() {
                  todaySteps = 0
                  prefs.edit().putString("steps_day", todayKey()).putInt("steps_count", 0).apply()
                  runOnUiThread {
                      web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep(0);", null)
                  }
              }

              fun triggerBiometricUnlock(reason: String = "Unlock ARISE System") {
                  runOnUiThread {
                      val bm = BiometricManager.from(this)
                      val authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG or
                              BiometricManager.Authenticators.BIOMETRIC_WEAK or
                              BiometricManager.Authenticators.DEVICE_CREDENTIAL
                      if (bm.canAuthenticate(authenticators) != BiometricManager.BIOMETRIC_SUCCESS) {
                          isUnlockedThisSession = true
                          web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Device lock not set');", null)
                          return@runOnUiThread
                      }
                      val executor = ContextCompat.getMainExecutor(this)
                      val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                              super.onAuthenticationSucceeded(result)
                              isUnlockedThisSession = true
                              triggerHaptic("success")
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Verified');", null)
                          }
                          override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                              super.onAuthenticationError(errorCode, errString)
                              val msg = errString.toString().replace("'", "")
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(false, '$msg');", null)
                          }
                          override fun onAuthenticationFailed() {
                              super.onAuthenticationFailed()
                              triggerHaptic("heavy")
                          }
                      })
                      val info = BiometricPrompt.PromptInfo.Builder()
                          .setTitle("ARISE SECURITY")
                          .setSubtitle(reason)
                          .setAllowedAuthenticators(authenticators)
                          .build()
                      try { prompt.authenticate(info) } catch (_: Exception) {}
                  }
              }

              override fun onPause() {
                  super.onPause()
                  lastPauseMs = System.currentTimeMillis()
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  registerStepListener()
                  web.evaluateJavascript("window.__ajResumeAudio && window.__ajResumeAudio();", null)
                  web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep($todaySteps);", null)
                  web.evaluateJavascript("window.__ariseRefreshPro && window.__ariseRefreshPro();", null)

                  val lockEnabled = prefs.getBoolean("bio_lock_on", false)
                  if (lockEnabled && (!isUnlockedThisSession || (lastPauseMs > 0 && System.currentTimeMillis() - lastPauseMs > 12000L))) {
                      isUnlockedThisSession = false
                      web.evaluateJavascript("window.__ajShowLockScreen && window.__ajShowLockScreen();", null)
                  }

                  if (LocationService.isRunning) {
                      val i = Intent(this, LocationService::class.java).apply { putExtra("reset", false) }
                      startForegroundService(i)
                  }
                  if (LocationService.latestJson.isNotEmpty()) {
                      web.evaluateJavascript("window.__onAJNativeGps && window.__onAJNativeGps(${LocationService.latestJson});", null)
                  }
              }

              override fun onDestroy() {
                  LocationService.onLocationUpdate = null
                  LocationService.onStatusUpdate = null
                  LocationService.onMilestoneSpeak = null
                  try { sensorManager.unregisterListener(this) } catch (_: Exception) {}
                  try { tts?.stop(); tts?.shutdown() } catch (_: Exception) {}
                  try { billingClient?.endConnection() } catch (_: Exception) {}
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.destroy()
                  super.onDestroy()
              }

