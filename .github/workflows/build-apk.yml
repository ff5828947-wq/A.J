                  try {
                      fusedClient.lastLocation.addOnSuccessListener { cached ->
                          if (cached != null) emitLocation(cached, isCached = true)
                      }
                  } catch (_: SecurityException) {}

                  try {
                      val interval = if (isVipTurbo) 500L else 1000L
                      val req = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, interval)
                          .setMinUpdateIntervalMillis(if (isVipTurbo) 350L else 500L)
                          .setMinUpdateDistanceMeters(0f)
                          .setWaitForAccurateLocation(false)
                          .build()
                      fusedClient.removeLocationUpdates(locCallback)
                      fusedClient.requestLocationUpdates(req, locCallback, Looper.getMainLooper())
                  } catch (_: SecurityException) {}

                  return START_STICKY
              }

              private fun setupBackgroundStepSensors() {
                  try {
                      sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                      sm.unregisterListener(this)
                      stepDetSensor = sm.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)
                      accelSensor = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                      val hasAct = checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED
                      if (hasAct && stepDetSensor != null) {
                          sm.registerListener(this, stepDetSensor, SensorManager.SENSOR_DELAY_FASTEST)
                      }
                      if (accelSensor != null) {
                          sm.registerListener(this, accelSensor, SensorManager.SENSOR_DELAY_GAME)
                      }
                  } catch (_: Exception) {}
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || !isRunning) return
                  if (event.sensor.type == Sensor.TYPE_STEP_DETECTOR) {
                      hasDetEvent = true
                      runSteps += 1
                      onStepIncrement?.invoke(1)
                      fuseStepDistance()
                  } else if (event.sensor.type == Sensor.TYPE_ACCELEROMETER && !hasDetEvent) {
                      val ax = event.values[0].toDouble()
                      val ay = event.values[1].toDouble()
                      val az = event.values[2].toDouble()
                      val mag = sqrt(ax * ax + ay * ay + az * az)
                      grav = grav * 0.9 + mag * 0.1
                      val linear = mag - grav
                      val now = System.currentTimeMillis()
                      if (linear > 2.35 && now - lastAccelStepMs > 340L) {
                          lastAccelStepMs = now
                          runSteps += 1
                          onStepIncrement?.invoke(1)
                          fuseStepDistance()
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun fuseStepDistance() {
                  // Indoor / slow-walk fusion: if hardware steps clearly exceed GPS distance, smoothly advance fused distance
                  val stepEstM = runSteps * 0.72
                  if (stepEstM > totalDistM) {
                      totalDistM = stepEstM
                  }
              }

              private fun applyKalman(lat: Double, lng: Double, acc: Float, timeMs: Long): Pair<Double, Double> {
                  val accuracy = acc.coerceAtLeast(3f).toDouble()
                  if (kalmanVar < 0.0 || kalmanLat.isNaN()) {
                      kalmanLat = lat
                      kalmanLng = lng
                      kalmanVar = accuracy * accuracy
                      kalmanTimeMs = timeMs
                      return Pair(lat, lng)
                  }
                  val dtSec = ((timeMs - kalmanTimeMs) / 1000.0).coerceIn(0.1, 30.0)
                  kalmanTimeMs = timeMs
                  val q = 3.2
                  kalmanVar += dtSec * q * q
                  val k = kalmanVar / (kalmanVar + accuracy * accuracy)
                  kalmanLat += k * (lat - kalmanLat)
                  kalmanLng += k * (lng - kalmanLng)
                  kalmanVar *= (1.0 - k)
                  return Pair(kalmanLat, kalmanLng)
              }

              private fun emitLocation(rawLoc: Location, isCached: Boolean) {
                  val nowMs = System.currentTimeMillis()
                  val acc = if (rawLoc.hasAccuracy()) rawLoc.accuracy else 25f
                  val (fLat, fLng) = if (isCached) Pair(rawLoc.latitude, rawLoc.longitude) else applyKalman(rawLoc.latitude, rawLoc.longitude, acc, nowMs)

                  val filtered = Location(rawLoc).apply {
                      latitude = fLat
                      longitude = fLng
                      time = nowMs
                  }

                  var instantSpeedKmh = if (rawLoc.hasSpeed() && rawLoc.speed > 0.35f && rawLoc.speed < 13.5f) {
                      rawLoc.speed.toDouble() * 3.6
                  } else 0.0

                  if (!isCached && acc <= 45f) {
                      val anchor = anchorLoc
                      if (anchor == null) {
                          anchorLoc = filtered
                          pointCount++
                          if (rawLoc.hasAltitude() && rawLoc.altitude > -50 && rawLoc.altitude < 6000) lastAlt = rawLoc.altitude
                          addRoutePoint(fLat, fLng, 0.0)
                      } else {
                          val d = anchor.distanceTo(filtered).toDouble()
                          val dtSec = ((nowMs - anchor.time) / 1000.0).coerceAtLeast(0.5)
                          val calcKmh = (d / dtSec) * 3.6
                          val minStepDist = if (acc <= 15f) 1.8 else 2.8

                          // ONLY update anchorLoc when genuine movement is confirmed (fixes stuck 0.01 km bug!)
                          if (d >= minStepDist && d <= 120.0 && calcKmh <= 42.0) {
                              gpsDistM += d
                              if (gpsDistM > totalDistM) totalDistM = gpsDistM
                              if (instantSpeedKmh < 0.5 && calcKmh > 0.6) instantSpeedKmh = calcKmh
                              lastMoveMs = nowMs

                              if (rawLoc.hasAltitude() && rawLoc.altitude > -50 && rawLoc.altitude < 6000) {
                                  if (!lastAlt.isNaN()) {
                                      val dAlt = rawLoc.altitude - lastAlt
                                      if (dAlt > 1.2 && dAlt < 25.0) elevGainM += dAlt
                                  }
                                  lastAlt = rawLoc.altitude
                              }

                              anchorLoc = filtered
                              pointCount++
                              addRoutePoint(fLat, fLng, instantSpeedKmh)
                          }
                      }
                  }

                  // Smooth speed & decay to 0 if stopped for > 5 seconds
                  if (instantSpeedKmh > 0.4) {
                      smoothSpeedKmh = if (smoothSpeedKmh < 0.2) instantSpeedKmh else (smoothSpeedKmh * 0.55 + instantSpeedKmh * 0.45)
                      lastMoveMs = nowMs
                  } else if (nowMs - lastMoveMs > 5000L) {
                      smoothSpeedKmh = 0.0
                  }

                  // Clamp realistic running/walking max speed (prevents GPS jump spike like 24.4 km/h)
                  if (smoothSpeedKmh > maxSpeedKmh && smoothSpeedKmh < 38.0 && pointCount >= 2) {
                      maxSpeedKmh = smoothSpeedKmh
                  }

                  val stepEstM = runSteps * 0.72
                  if (stepEstM > totalDistM) totalDistM = stepEstM

                  val elapsedSec = ((nowMs - startTimeMs) / 1000L).coerceAtLeast(1L)
                  val avgSpeedKmh = (totalDistM / elapsedSec.toDouble()) * 3.6
                  val kcal = (totalDistM / 1000.0) * 65.0
                  val bearing = if (rawLoc.hasBearing()) rawLoc.bearing.toDouble() else 0.0
                  val alt = if (rawLoc.hasAltitude() && rawLoc.altitude > -50 && rawLoc.altitude < 6000) rawLoc.altitude else 0.0
                  val paceMinKm = if (smoothSpeedKmh > 0.8) 60.0 / smoothSpeedKmh else if (avgSpeedKmh > 0.8) 60.0 / avgSpeedKmh else 0.0
                  val cadence = if (elapsedSec >= 5 && runSteps > 0) ((runSteps * 60.0) / elapsedSec).toInt().coerceAtMost(240) else 0

                  val currentHalfKm = (totalDistM / 500.0).toInt()
                  if (currentHalfKm > lastAnnounced500m && currentHalfKm > 0) {
                      lastAnnounced500m = currentHalfKm
                      val kmVal = currentHalfKm * 0.5
                      val msg = String.format(Locale.US, "Distance %.1f kilometers completed. Average speed %.1f kilometers per hour. Keep pushing, Hunter!", kmVal, avgSpeedKmh)
                      onMilestoneSpeak?.invoke(msg)
                  }

                  val json = String.format(
                      Locale.US,
                      "{\"lat\":%.6f,\"lng\":%.6f,\"acc\":%.1f,\"spd\":%.2f,\"spdMs\":%.2f,\"maxSpd\":%.2f,\"avgSpd\":%.2f,\"pace\":%.2f,\"cadence\":%d,\"alt\":%.1f,\"elevGain\":%.1f,\"bearing\":%.1f,\"distM\":%.1f,\"gpsDistM\":%.1f,\"kcal\":%.1f,\"steps\":%d,\"pts\":%d,\"sec\":%d,\"satU\":%d,\"satT\":%d,\"bg\":true}",
                      fLat, fLng, acc, smoothSpeedKmh, smoothSpeedKmh / 3.6, maxSpeedKmh, avgSpeedKmh, paceMinKm, cadence, alt, elevGainM, bearing, totalDistM, gpsDistM, kcal, runSteps, pointCount, elapsedSec, satUsed, satTotal
                  )
                  latestJson = json
                  onLocationUpdate?.invoke(json)

                  if (nowMs - lastNotifMs >= 2000L) {
                      lastNotifMs = nowMs
                      val km = totalDistM / 1000.0
                      val mins = elapsedSec / 60
                      val secs = elapsedSec % 60
                      val text = String.format(Locale.US, "%.2f km • %.1f km/h • %d steps • %02d:%02d", km, smoothSpeedKmh, runSteps, mins, secs)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotif(text))
                  }
              }

              private fun addRoutePoint(lat: Double, lng: Double, spd: Double) {
                  synchronized(routePoints) {
                      if (routePoints.size >= 2000) routePoints.removeAt(0)
                      routePoints.add(doubleArrayOf(lat, lng, spd))
                  }
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ch = NotificationChannel(CH_ID, "ARISE Real-Time GPS", NotificationManager.IMPORTANCE_LOW)
                  nm.createNotificationChannel(ch)
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 1, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, CH_ID)
                      .setContentTitle(if (isVipTurbo) "👑 ARISE VIP TURBO GPS" else "⚡ ARISE KALMAN GPS ACTIVE")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  isRunning = false
                  if (::sm.isInitialized) { try { sm.unregisterListener(this) } catch (_: Exception) {} }
                  if (::fusedClient.isInitialized) { try { fusedClient.removeLocationUpdates(locCallback) } catch (_: Exception) {} }
                  if (::lm.isInitialized) { try { lm.unregisterGnssStatusCallback(gnssCb) } catch (_: Exception) {} }
                  super.onDestroy()
              }
          }
