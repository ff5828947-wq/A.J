              // --- VIP Google Play Billing ---
              private fun setupBilling() {
                  try {
                      billingClient = BillingClient.newBuilder(this)
                          .setListener(this)
                          .enablePendingPurchases(PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())
                          .build()
                      billingClient?.startConnection(object : BillingClientStateListener {
                          override fun onBillingSetupFinished(result: BillingResult) {
                              if (result.responseCode == BillingClient.BillingResponseCode.OK) {
                                  queryVipProduct()
                                  restoreVipPurchases(silent = true)
                              }
                          }
                          override fun onBillingServiceDisconnected() {}
                      })
                  } catch (_: Exception) {}
              }

              private fun queryVipProduct() {
                  val client = billingClient ?: return
                  val productList = listOf(QueryProductDetailsParams.Product.newBuilder().setProductId(VIP_PRODUCT_ID).setProductType(BillingClient.ProductType.SUBS).build())
                  client.queryProductDetailsAsync(QueryProductDetailsParams.newBuilder().setProductList(productList).build()) { res, detailsList ->
                      if (res.responseCode == BillingClient.BillingResponseCode.OK && detailsList.isNotEmpty()) vipProductDetails = detailsList[0]
                  }
              }

              fun launchVipBilling() {
                  runOnUiThread {
                      val client = billingClient
                      val pd = vipProductDetails
                      val offerToken = pd?.subscriptionOfferDetails?.firstOrNull()?.offerToken
                      if (client != null && client.isReady && pd != null && offerToken != null) {
                          val prodParams = BillingFlowParams.ProductDetailsParams.newBuilder().setProductDetails(pd).setOfferToken(offerToken).build()
                          client.launchBillingFlow(this, BillingFlowParams.newBuilder().setProductDetailsParamsList(listOf(prodParams)).build())
                      } else {
                          Toast.makeText(this, "Connecting to Google Play Billing... Ensure 'arise_vip_monthly' is active in Play Console.", Toast.LENGTH_LONG).show()
                          queryVipProduct()
                      }
                  }
              }

              fun restoreVipPurchases(silent: Boolean = false) {
                  val client = billingClient
                  if (client == null || !client.isReady) {
                      if (!silent) runOnUiThread { Toast.makeText(this, "Unable to reach Google Play Store. Check internet.", Toast.LENGTH_SHORT).show() }
                      return
                  }
                  client.queryPurchasesAsync(QueryPurchasesParams.newBuilder().setProductType(BillingClient.ProductType.SUBS).build()) { res, purchases ->
                      if (res.responseCode == BillingClient.BillingResponseCode.OK) {
                          val hasVip = purchases.any { it.products.contains(VIP_PRODUCT_ID) && it.purchaseState == Purchase.PurchaseState.PURCHASED }
                          prefs.edit().putBoolean("vip_active", hasVip).apply()
                          LocationService.isVipTurbo = hasVip
                          runOnUiThread { web.evaluateJavascript("window.__onAJVipUpdated && window.__onAJVipUpdated($hasVip);", null) }
                          if (!silent) runOnUiThread { Toast.makeText(this, if (hasVip) "👑 Sovereign VIP Restored!" else "No active VIP subscription found.", Toast.LENGTH_SHORT).show() }
                      }
                  }
              }

              override fun onPurchasesUpdated(result: BillingResult, purchases: MutableList<Purchase>?) {
                  if (result.responseCode == BillingClient.BillingResponseCode.OK && purchases != null) {
                      for (p in purchases) {
                          if (p.purchaseState == Purchase.PurchaseState.PURCHASED) {
                              if (!p.isAcknowledged) {
                                  billingClient?.acknowledgePurchase(AcknowledgePurchaseParams.newBuilder().setPurchaseToken(p.purchaseToken).build()) {}
                              }
                              prefs.edit().putBoolean("vip_active", true).apply()
                              LocationService.isVipTurbo = true
                              runOnUiThread {
                                  triggerHaptic("success")
                                  speakCoach("Sovereign VIP Mode Activated!")
                                  web.evaluateJavascript("window.__onAJVipUpdated && window.__onAJVipUpdated(true);", null)
                              }
                          }
                      }
                  }
              }

