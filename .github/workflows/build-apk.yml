            // ==========================================================
            // ULTRA PRO MAX TACTICAL LIVE GPS MAP ENGINE (60FPS CANVAS)
            // ==========================================================
            var uMap = {
              lat: 21.83217, lng: 88.12444, acc: 15, bearing: 0, spd: 0,
              zoom: 17, mode: 'dark', autoFollow: true, panX: 0, panY: 0,
              tiles: {}, route: [], pulse: 0, dragging: false, lastX: 0, lastY: 0, raf: 0
            };

            function latLngToWorld(lat, lng, z) {
              var n = Math.pow(2, z) * 256;
              var x = ((lng + 180) / 360) * n;
              var rad = lat * Math.PI / 180;
              var y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
              return { x: x, y: y };
            }

            function speedToColor(spd) {
              if (spd >= 12) return '#ff3d00';
              if (spd >= 7.5) return '#ffd54f';
              if (spd >= 3.5) return '#00e676';
              return '#00f7ff';
            }

            function getMapTile(z, tx, ty, mode) {
              var key = mode + '_' + z + '_' + tx + '_' + ty;
              if (uMap.tiles[key]) return uMap.tiles[key];
              var img = new Image();
              img.crossOrigin = 'anonymous';
              img.src = 'https://arise-tile.local/' + z + '/' + tx + '/' + ty + '.png?mode=' + mode;
              uMap.tiles[key] = img;
              var keys = Object.keys(uMap.tiles);
              if (keys.length > 90) delete uMap.tiles[keys[0]];
              return img;
            }

            function drawUltraMap() {
              var cvs = document.getElementById('ariseUltraMapCanvas');
              if (!cvs || !cvs.getContext) { uMap.raf = 0; return; }
              var wrap = document.getElementById('ariseUltraMapWrap');
              var w = wrap ? wrap.clientWidth : 320;
              var h = wrap ? wrap.clientHeight : 245;
              if (w < 10 || h < 10) { uMap.raf = requestAnimationFrame(drawUltraMap); return; }
              if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }

              var ctx = cvs.getContext('2d');
              ctx.fillStyle = '#030b16';
              ctx.fillRect(0, 0, w, h);

              var centerW = latLngToWorld(uMap.lat, uMap.lng, uMap.zoom);
              var camX = centerW.x - uMap.panX;
              var camY = centerW.y - uMap.panY;
              var maxTile = Math.pow(2, uMap.zoom);

              var startTx = Math.floor((camX - w / 2) / 256) - 1;
              var endTx = Math.floor((camX + w / 2) / 256) + 1;
              var startTy = Math.floor((camY - h / 2) / 256) - 1;
              var endTy = Math.floor((camY + h / 2) / 256) + 1;

              for (var tx = startTx; tx <= endTx; tx++) {
                for (var ty = startTy; ty <= endTy; ty++) {
                  if (ty < 0 || ty >= maxTile) continue;
                  var wrappedTx = ((tx % maxTile) + maxTile) % maxTile;
                  var tile = getMapTile(uMap.zoom, wrappedTx, ty, uMap.mode);
                  var dx = Math.round(tx * 256 - camX + w / 2);
                  var dy = Math.round(ty * 256 - camY + h / 2);
                  if (tile.complete && tile.naturalWidth > 0) {
                    ctx.drawImage(tile, dx, dy, 256, 256);
                  } else {
                    ctx.strokeStyle = 'rgba(0,247,255,0.08)';
                    ctx.strokeRect(dx, dy, 256, 256);
                  }
                }
              }

              // Subtle cyber vignette
              var grad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.25, w/2, h/2, Math.max(w,h)*0.72);
              grad.addColorStop(0, 'rgba(0,0,0,0)');
              grad.addColorStop(1, 'rgba(2,8,18,0.42)');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, w, h);

              // Draw Neon Speed-Colored Route Trail
              if (uMap.route.length > 1) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                for (var i = 1; i < uMap.route.length; i++) {
                  var p0 = latLngToWorld(uMap.route[i-1][0], uMap.route[i-1][1], uMap.zoom);
                  var p1 = latLngToWorld(uMap.route[i][0], uMap.route[i][1], uMap.zoom);
                  var x0 = p0.x - camX + w / 2, y0 = p0.y - camY + h / 2;
                  var x1 = p1.x - camX + w / 2, y1 = p1.y - camY + h / 2;
                  var col = speedToColor(uMap.route[i][2] || 0);
                  ctx.save();
                  ctx.strokeStyle = col;
                  ctx.shadowColor = col;
                  ctx.shadowBlur = 10;
                  ctx.lineWidth = 4.5;
                  ctx.beginPath();
                  ctx.moveTo(x0, y0);
                  ctx.lineTo(x1, y1);
                  ctx.stroke();
                  ctx.restore();
                }

                // Start Pin
                var sp = latLngToWorld(uMap.route[0][0], uMap.route[0][1], uMap.zoom);
                var sx = sp.x - camX + w / 2, sy = sp.y - camY + h / 2;
                ctx.fillStyle = '#00e676';
                ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#021a0d'; ctx.lineWidth = 2; ctx.stroke();
              }

              // Hunter Current Position Marker + Radar Pulse + Compass Cone
              var ux = centerW.x - camX + w / 2;
              var uy = centerW.y - camY + h / 2;
              uMap.pulse = (uMap.pulse + 0.035) % 1;

              // Accuracy Halo
              var metersPerPx = (156543.03392 * Math.cos(uMap.lat * Math.PI / 180)) / Math.pow(2, uMap.zoom);
              var accRad = Math.min(Math.max(uMap.acc / metersPerPx, 14), 68);
              ctx.beginPath();
              ctx.arc(ux, uy, accRad, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(0,247,255,0.12)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(0,247,255,0.35)';
              ctx.lineWidth = 1;
              ctx.stroke();

              // Radar Pulse Ring
              ctx.beginPath();
              ctx.arc(ux, uy, 8 + uMap.pulse * 32, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(0,247,255,' + ((1 - uMap.pulse) * 0.8) + ')';
              ctx.lineWidth = 2;
              ctx.stroke();

              // Directional Heading Cone
              var headRad = (uMap.bearing - 90) * Math.PI / 180;
              ctx.save();
              ctx.beginPath();
              ctx.moveTo(ux, uy);
              ctx.arc(ux, uy, 28, headRad - 0.45, headRad + 0.45);
              ctx.closePath();
              ctx.fillStyle = 'rgba(0,247,255,0.28)';
              ctx.fill();
              ctx.restore();

              // Core Glowing Dot
              ctx.save();
              ctx.shadowColor = '#00f7ff';
              ctx.shadowBlur = 16;
              ctx.beginPath(); ctx.arc(ux, uy, 7.5, 0, Math.PI * 2);
              ctx.fillStyle = '#00f7ff'; ctx.fill();
              ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
              ctx.restore();

              uMap.raf = requestAnimationFrame(drawUltraMap);
            }

            window.__ariseMapZoom = function(delta) {
              uMap.zoom = Math.max(13, Math.min(19, uMap.zoom + delta));
              if (window.AJNative && window.AJNative.haptic) window.AJNative.haptic('tap');
            };
