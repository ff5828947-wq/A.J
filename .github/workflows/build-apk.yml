              .inp {
                width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--accent-border);
                background: var(--card-inner); color: var(--text-main); font-size: 12.5px; font-weight: 800; outline: none;
              }
              #pinOverlay {
                position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center;
                background: rgba(4,7,15,0.96); padding: 20px;
              }
              #pinOverlay.open { display: flex; }
              #toast {
