          LOGO_FILE=$(find . -maxdepth 1 \( -iname "logo.png" -o -iname "logo.jpg" -o -iname "logo.jpeg" -o -iname "logo.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/assets/arise_logo.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp "$LOGO_FILE" app/src/main/assets/arise_logo.png
            fi
            sed -i 's/android:label="ARISE: Daily Workout Exercise"/android:label="ARISE: Daily Workout Exercise" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/aj/system/AlarmScheduler.kt
          package com.aj.system

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar

          object AlarmScheduler {
              private const val PREF_NAME = "arise_pro_prefs"
              private const val REQ_MORNING = 777

              fun scheduleMorningAlarm(context: Context, hour: Int, minute: Int, label: String) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit()
                      .putBoolean("alarm_enabled", true)
                      .putInt("alarm_hour", hour)
                      .putInt("alarm_minute", minute)
                      .putString("alarm_label", label)
                      .apply()

                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis() + 1000L) {
                          add(Calendar.DAY_OF_YEAR, 1)
                      }
                  }
                  scheduleAt(context, cal.timeInMillis, label)
              }

              fun scheduleSnooze(context: Context, minutes: Int, label: String) {
                  val triggerMs = System.currentTimeMillis() + (minutes * 60_000L)
                  scheduleAt(context, triggerMs, "SNOOZE: $label")
              }

              private fun scheduleAt(context: Context, triggerMs: Long, label: String) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val triggerIntent = Intent(context, AlarmReceiver::class.java).apply {
                      putExtra("label", label)
                  }
                  val triggerPi = PendingIntent.getBroadcast(
                      context, REQ_MORNING, triggerIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val showIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val showPi = PendingIntent.getActivity(
                      context, REQ_MORNING + 1, showIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  try {
                      val info = AlarmManager.AlarmClockInfo(triggerMs, showPi)
                      am.setAlarmClock(info, triggerPi)
                  } catch (_: Exception) {
                      try {
                          if (am.canScheduleExactAlarms()) {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerMs, triggerPi)
                          } else {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerMs, triggerPi)
                          }
                      } catch (_: Exception) {
                          am.set(AlarmManager.RTC_WAKEUP, triggerMs, triggerPi)
                      }
                  }
              }

              fun cancelAlarm(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      context, REQ_MORNING, Intent(context, AlarmReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).edit()
                      .putBoolean("alarm_enabled", false)
                      .apply()
                  context.stopService(Intent(context, AlarmForegroundService::class.java))
              }

              fun restoreIfEnabled(context: Context) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  if (prefs.getBoolean("alarm_enabled", false)) {
                      val h = prefs.getInt("alarm_hour", 6)
                      val m = prefs.getInt("alarm_minute", 0)
                      val lbl = prefs.getString("alarm_label", "DAILY QUEST — ARISE!") ?: "DAILY QUEST — ARISE!"
                      scheduleMorningAlarm(context, h, m, lbl)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/AlarmReceiver.kt
          package com.aj.system

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val label = intent.getStringExtra("label") ?: "DAILY QUEST — ARISE!"
                  val svc = Intent(context, AlarmForegroundService::class.java).apply {
                      putExtra("label", label)
                  }
                  try {
                      context.startForegroundService(svc)
                  } catch (_: Exception) {
                      try { context.startService(svc) } catch (_: Exception) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/AlarmForegroundService.kt
          package com.aj.system

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager

          class AlarmForegroundService : Service() {
              companion object {
                  const val CH_ID = "arise_alarm_ring_v2"
                  const val NOTIF_ID = 1009
                  const val ACTION_STOP = "com.aj.system.STOP_ALARM"
                  const val ACTION_SNOOZE = "com.aj.system.SNOOZE_ALARM"
                  @Volatile var isRinging = false
              }

              private var mediaPlayer: MediaPlayer? = null
              private var vibrator: Vibrator? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private val handler = Handler(Looper.getMainLooper())
              private var currentLabel = "DAILY QUEST — ARISE!"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> { stopSelf(); return START_NOT_STICKY }
                      ACTION_SNOOZE -> {
                          val lbl = intent.getStringExtra("label") ?: currentLabel
                          AlarmScheduler.scheduleSnooze(this, 5, lbl)
                          stopSelf()
                          return START_NOT_STICKY
                      }
                  }

                  currentLabel = intent?.getStringExtra("label") ?: "DAILY QUEST — ARISE!"
                  isRinging = true

                  val prefs = getSharedPreferences("arise_pro_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("alarm_enabled", false) && !currentLabel.startsWith("SNOOZE:")) {
                      val h = prefs.getInt("alarm_hour", 6)
                      val m = prefs.getInt("alarm_minute", 0)
                      val savedLbl = prefs.getString("alarm_label", currentLabel) ?: currentLabel
                      AlarmScheduler.scheduleMorningAlarm(this, h, m, savedLbl)
                  }

                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ARISE::AlarmWakeLock")
                      wakeLock?.acquire(5 * 60 * 1000L)
                  } catch (_: Exception) {}

                  createChannel()
                  val notif = buildNotification(currentLabel)
                  try {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } catch (_: Exception) {
                      startForeground(NOTIF_ID, notif)
                  }

                  startAlarmAudioAndVibration()
                  handler.removeCallbacksAndMessages(null)
                  handler.postDelayed({ stopSelf() }, 4 * 60 * 1000L)
                  return START_STICKY
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ch = NotificationChannel(CH_ID, "ARISE Wake-Up Alarm", NotificationManager.IMPORTANCE_HIGH).apply {
                      setBypassDnd(true)
                      lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                      setSound(null, null)
                  }
                  nm.createNotificationChannel(ch)
              }

              private fun buildNotification(label: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openPi = PendingIntent.getActivity(this, 10, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stopPi = PendingIntent.getService(this, 11, Intent(this, AlarmForegroundService::class.java).apply { action = ACTION_STOP }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val snoozePi = PendingIntent.getService(this, 12, Intent(this, AlarmForegroundService::class.java).apply { action = ACTION_SNOOZE; putExtra("label", label) }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  return Notification.Builder(this, CH_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("⚡ ARISE SYSTEM ALARM")
                      .setContentText(label)
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setOngoing(true)
                      .setContentIntent(openPi)
                      .setFullScreenIntent(openPi, true)
                      .addAction(Notification.Action.Builder(null, "STOP ALARM", stopPi).build())
                      .addAction(Notification.Action.Builder(null, "SNOOZE 5m", snoozePi).build())
                      .build()
              }

              private fun startAlarmAudioAndVibration() {
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(this@AlarmForegroundService, uri)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          isLooping = true
                          prepare()
                          start()
                      }
                  } catch (_: Exception) {}

                  try {
                      val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vibrator = vm.defaultVibrator
                      vibrator?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 700, 350, 700, 350), 0))
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  isRinging = false
                  handler.removeCallbacksAndMessages(null)
                  try { mediaPlayer?.stop() } catch (_: Exception) {}
                  try { mediaPlayer?.release() } catch (_: Exception) {}
                  mediaPlayer = null
                  try { vibrator?.cancel() } catch (_: Exception) {}
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/MissionReminderReceiver.kt
          package com.aj.system

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar

          object MissionScheduler {
              private const val PREF_NAME = "arise_pro_prefs"
              private const val REQ_MORNING_QUEST = 4001
              private const val REQ_EVENING_PENALTY = 4002

              fun isEnabled(context: Context): Boolean =
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).getBoolean("mission_alerts_on", true)

              fun setEnabled(context: Context, on: Boolean) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).edit().putBoolean("mission_alerts_on", on).apply()
                  if (on) scheduleDailyMissions(context) else cancelDailyMissions(context)
              }

              fun scheduleDailyMissions(context: Context) {
                  if (!isEnabled(context)) return
                  scheduleSlot(context, REQ_MORNING_QUEST, 7, 30,
                      "⚔️ [SYSTEM ALERT] Daily Quest Arrived!",
                      "Complete your ARISE Workout Mission today and keep your Hunter streak alive!")
                  scheduleSlot(context, REQ_EVENING_PENALTY, 19, 30,
                      "⚠️ [PENALTY WARNING] Complete Your Mission!",
                      "Midnight is approaching! Finish your ARISE Daily Workout Mission now to earn XP.")
              }

              private fun scheduleSlot(context: Context, reqCode: Int, hour: Int, minute: Int, title: String, msg: String) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, MissionReminderReceiver::class.java).apply {
                      putExtra("title", title)
                      putExtra("message", msg)
                      putExtra("reqCode", reqCode)
                  }
                  val pi = PendingIntent.getBroadcast(context, reqCode, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis() + 2000L) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  try {
                      if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                  } catch (_: Exception) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                  }
              }

              fun cancelDailyMissions(context: Context) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  listOf(REQ_MORNING_QUEST, REQ_EVENING_PENALTY).forEach { req ->
                      val pi = PendingIntent.getBroadcast(context, req, Intent(context, MissionReminderReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(pi)
                  }
              }

              fun showNotificationNow(context: Context, title: String, message: String, id: Int = 4099) {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "arise_mission_alerts_v1"
                  val ch = NotificationChannel(chId, "ARISE Daily Mission Alerts", NotificationManager.IMPORTANCE_HIGH).apply {
                      enableVibration(true)
                      vibrationPattern = longArrayOf(0, 250, 120, 250)
                  }
                  nm.createNotificationChannel(ch)
                  val openIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(context, id, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notif = Notification.Builder(context, chId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setStyle(Notification.BigTextStyle().bigText(message))
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(id, notif)
              }
          }

          class MissionReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val title = intent.getStringExtra("title") ?: "⚔️ [SYSTEM ALERT] Complete Your Mission!"
                  val message = intent.getStringExtra("message") ?: "Your ARISE Daily Workout Mission is waiting, Hunter!"
                  val reqCode = intent.getIntExtra("reqCode", 4001)
                  MissionScheduler.showNotificationNow(context, title, message, reqCode)
                  MissionScheduler.scheduleDailyMissions(context)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/BootReceiver.kt
          package com.aj.system

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED ||
                      intent.action == Intent.ACTION_MY_PACKAGE_REPLACED) {
                      AlarmScheduler.restoreIfEnabled(context)
                      MissionScheduler.scheduleDailyMissions(context)
                  }
              }
          }
