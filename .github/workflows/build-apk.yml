            // Reset base index.html theme classes so GOLD & RGB never mix with LIGHT/RED
            function resetBaseDarkTheme() {
              var root = document.documentElement;
              var body = document.body;
              if (root) {
                root.removeAttribute('data-theme');
                root.style.backgroundColor = '#030812';
              }
              if (body) {
                body.classList.remove('light', 'light-mode', 'theme-light', 'theme-red', 'theme-green', 'theme-pink', 'theme-violet', 'theme-gold');
                body.style.backgroundColor = '#030812';
              }
            }

            function unlockGoldAndRgbButtons() {
              document.querySelectorAll('button').forEach(function(b) {
                if (b.closest && b.closest('#ariseVipModal')) return;
                var raw = (b.textContent || '').toUpperCase();
                var clean = raw.replace(/[^A-Z]/gi, '');
                if (clean === 'GOLD' || clean === 'RGB') {
                  b.disabled = false;
                  b.style.opacity = '1';
                  b.style.pointerEvents = 'auto';
                  b.removeAttribute('onclick');
                  if (raw.indexOf('🔒') !== -1 || raw.indexOf('LOCK') !== -1) {
                    b.textContent = clean === 'GOLD' ? 'GOLD' : 'RGB';
                  }
                  if (!b.__ariseThemeBound) {
                    b.__ariseThemeBound = true;
                    b.addEventListener('click', function(ev) {
                      ev.stopImmediatePropagation();
                      ev.preventDefault();
                      applyUniversalTheme(clean.toLowerCase());
                      showToast(clean === 'RGB' ? '🌈 Live RGB Theme Active!' : '✨ Gold Theme Active!');
                      if (window.AJNative && window.AJNative.haptic) window.AJNative.haptic('tap');
                    }, true);
                  }
                }
              });
              highlightThemeButtons(currentLiveTheme);
            }

            function applyUniversalTheme(themeName) {
              var t = (themeName || 'cyan').toLowerCase().trim();
              currentLiveTheme = t;
              var root = document.documentElement;
              var mapCvs = document.getElementById('ajRealMapCanvas');
              if (rgbIv) { clearInterval(rgbIv); rgbIv = null; }
              root.style.filter = '';
              if (mapCvs) mapCvs.style.filter = '';
              allThemeClasses.forEach(function(c) { root.classList.remove(c); });
              resetBaseDarkTheme();

              if (t === 'rgb') {
                rgbIv = setInterval(function() {
                  rgbDeg = (rgbDeg + 5) % 360;
                  root.style.filter = 'hue-rotate(' + rgbDeg + 'deg) saturate(1.32)';
                  var mc = document.getElementById('ajRealMapCanvas');
                  if (mc) mc.style.filter = 'hue-rotate(' + (-rgbDeg) + 'deg)';
                }, 90);
              } else if (t !== 'cyan' && t !== 'default') {
                var map = {
                  'gold': 'arise-theme-gold', 'red': 'arise-theme-red', 'crimson': 'arise-theme-red',
                  'green': 'arise-theme-green', 'emerald': 'arise-theme-green', 'matrix': 'arise-theme-green',
                  'violet': 'arise-theme-violet', 'purple': 'arise-theme-violet', 'amethyst': 'arise-theme-violet',
                  'pink': 'arise-theme-pink', 'dark': 'arise-theme-dark', 'frost': 'arise-theme-dark', 'light': 'arise-theme-light'
                };
                if (map[t]) root.classList.add(map[t]);
              }
              try { localStorage.setItem('arise_live_theme_v2', t); } catch(e) {}
              document.querySelectorAll('.vip-theme-pill').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-theme') === t);
              });
              highlightThemeButtons(t);
            }
            window.__ariseSetLiveTheme = applyUniversalTheme;

            try {
              var savedTheme = localStorage.getItem('arise_live_theme_v2');
              if (savedTheme) applyUniversalTheme(savedTheme);
            } catch(e) {}

            function removeDomainSystem() {
              document.querySelectorAll('button, a, [role="tab"], .nav-btn, .tab').forEach(function(el) {
                var txt = (el.textContent || '').trim().toUpperCase();
                if (txt === 'DOMAIN' || txt === 'DOMAINS' || (txt.indexOf('DOMAIN') !== -1 && txt.length < 18)) {
                  el.style.display = 'none';
                }
              });
            }

            // REAL GOOGLE MAPS ENGINE (DIRECT GOOGLE TILES + TOUCH PAN + ZERO FLICKER + BLUE DOT!)
            var realMapZoom = 17;
            var realMapMode = 'hybrid';
            var realMapLat = 21.83264;
            var realMapLng = 88.12419;
            var mapViewLat = 21.83264;
            var mapViewLng = 88.12419;
            var mapFollowUser = true;
            var realMapAcc = 15;
            var realMapPath = [];
            var tileCache = {};
            var mapDrag = { active: false, lastX: 0, lastY: 0 };

            function latLngToTile(lat, lng, z) {
              var n = Math.pow(2, z);
              var x = (lng + 180) / 360 * n;
              var rad = lat * Math.PI / 180;
              var y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
              return { x: x, y: y };
            }

            function tileToLatLng(x, y, z) {
              var n = Math.pow(2, z);
              var lng = x / n * 360 - 180;
              var latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
              return { lat: latRad * 180 / Math.PI, lng: lng };
            }

            function getGoogleTileUrl(mode, z, x, y) {
              var sub = (Math.abs(x + y) % 4);
              if (mode === 'road')    return 'https://mt' + sub + '.google.com/vt/lyrs=m&hl=en&x=' + x + '&y=' + y + '&z=' + z;
              if (mode === 'terrain') return 'https://mt' + sub + '.google.com/vt/lyrs=p&hl=en&x=' + x + '&y=' + y + '&z=' + z;
              if (mode === 'dark')    return 'https://mt' + sub + '.google.com/vt/lyrs=m&hl=en&x=' + x + '&y=' + y + '&z=' + z;
              return 'https://mt' + sub + '.google.com/vt/lyrs=y&hl=en&x=' + x + '&y=' + y + '&z=' + z;
            }

            function drawRealLiveMap() {
              var cvs = document.getElementById('ajRealMapCanvas');
              if (!cvs) return;
              var w = cvs.clientWidth || 320;
              var h = cvs.clientHeight || 260;
              if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
              var c = cvs.getContext('2d');

              var center = latLngToTile(mapViewLat, mapViewLng, realMapZoom);
              var cx = Math.floor(center.x), cy = Math.floor(center.y);
              var offX = (center.x - cx) * 256, offY = (center.y - cy) * 256;

              c.save();
              c.filter = realMapMode === 'dark' ? 'invert(0.92) hue-rotate(180deg) brightness(0.9) contrast(1.1)' : 'none';

              var maxTile = Math.pow(2, realMapZoom);
              for (var dx = -2; dx <= 2; dx++) {
                for (var dy = -2; dy <= 2; dy++) {
                  var tx = (cx + dx + maxTile) % maxTile;
                  var ty = cy + dy;
                  if (ty < 0 || ty >= maxTile) continue;
                  var drawX = Math.round(w / 2 - offX + dx * 256);
                  var drawY = Math.round(h / 2 - offY + dy * 256);
                  if (drawX + 256 < 0 || drawX > w || drawY + 256 < 0 || drawY > h) continue;

                  var key = realMapMode + '_' + realMapZoom + '_' + tx + '_' + ty;
                  var img = tileCache[key];
                  if (!img) {
                    img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = function() { drawRealLiveMap(); };
                    img.src = getGoogleTileUrl(realMapMode, realMapZoom, tx, ty);
                    tileCache[key] = img;
                  }
                  if (img.complete && img.naturalWidth > 0) {
                    c.drawImage(img, drawX, drawY, 256, 256);
                  }
                }
              }
              c.restore();

              if (realMapPath.length > 1) {
                c.save();
                c.strokeStyle = '#1a73e8';
                c.lineWidth = 5;
                c.lineCap = 'round';
                c.lineJoin = 'round';
                c.beginPath();
                for (var i = 0; i < realMapPath.length; i++) {
                  var pt = latLngToTile(realMapPath[i].lat, realMapPath[i].lng, realMapZoom);
                  var px = w / 2 + (pt.x - center.x) * 256;
                  var py = h / 2 + (pt.y - center.y) * 256;
                  if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.stroke();
                c.strokeStyle = '#66b2ff';
                c.lineWidth = 2;
                c.stroke();
                c.restore();
              }

              var userPt = latLngToTile(realMapLat, realMapLng, realMapZoom);
              var ux = w / 2 + (userPt.x - center.x) * 256;
              var uy = h / 2 + (userPt.y - center.y) * 256;
              var accPx = Math.max(16, Math.min(48, realMapAcc * 0.9));

              c.save();
              c.fillStyle = 'rgba(66, 133, 244, 0.24)';
              c.strokeStyle = 'rgba(66, 133, 244, 0.55)';
              c.lineWidth = 1.5;
              c.beginPath(); c.arc(ux, uy, accPx, 0, Math.PI * 2); c.fill(); c.stroke();

              c.fillStyle = '#4285f4';
              c.strokeStyle = '#ffffff';
              c.lineWidth = 3;
              c.shadowColor = 'rgba(0,0,0,0.45)';
              c.shadowBlur = 6;
              c.beginPath(); c.arc(ux, uy, 7.5, 0, Math.PI * 2); c.fill(); c.stroke();
              c.restore();
            }

            function bindRealMapTouch(cvs) {
              if (!cvs || cvs.__boundPan) return;
              cvs.__boundPan = true;
              cvs.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                  mapDrag.active = true;
                  mapDrag.lastX = e.touches[0].clientX;
                  mapDrag.lastY = e.touches[0].clientY;
                  mapFollowUser = false;
                }
              }, { passive: true });
              cvs.addEventListener('touchmove', function(e) {
                if (!mapDrag.active || e.touches.length !== 1) return;
                e.preventDefault();
                var nx = e.touches[0].clientX, ny = e.touches[0].clientY;
                var dx = nx - mapDrag.lastX, dy = ny - mapDrag.lastY;
                mapDrag.lastX = nx; mapDrag.lastY = ny;
                var cur = latLngToTile(mapViewLat, mapViewLng, realMapZoom);
                var nextLL = tileToLatLng(cur.x - dx / 256, cur.y - dy / 256, realMapZoom);
                mapViewLat = nextLL.lat;
                mapViewLng = nextLL.lng;
                drawRealLiveMap();
              }, { passive: false });
              cvs.addEventListener('touchend', function() { mapDrag.active = false; });
            }

