name: Build A.J Kotlin APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Native Kotlin Project
        run: |
          mkdir -p app/src/main/java/com/aj/system app/src/main/assets

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AJSystem"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aj.system"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aj.system"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "2.3"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:label="ARISE:Daily Workout Exercise"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <service
                      android:name=".LocationService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "logo.png" -o -iname "logo.jpg" -o -iname "logo.jpeg" -o -iname "logo.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="ARISE:Daily Workout Exercise"/android:label="ARISE:Daily Workout Exercise" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/aj/system/AlarmReceiver.kt
          package com.aj.system

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val label = intent.getStringExtra("label") ?: "DAILY QUEST — ARISE!"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "aj_alarm_channel_v1"
                  val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      val ch = NotificationChannel(chId, "A.J Alarms", NotificationManager.IMPORTANCE_HIGH).apply {
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 500, 200, 500, 200, 500)
                          setSound(alarmUri, attrs)
                      }
                      nm.createNotificationChannel(ch)
                  }

                  val openIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(
                      context, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(context, chId)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(context)
                  }

                  val notif = builder
                      .setContentTitle("A.J SYSTEM ALARM")
                      .setContentText(label)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()

                  nm.notify(1001, notif)
                  try { RingtoneManager.getRingtone(context, alarmUri)?.play() } catch (_: Exception) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/LocationService.kt
          package com.aj.system

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.location.GnssStatus
          import android.location.Location
          import android.location.LocationManager
          import android.os.Build
          import android.os.IBinder
          import android.os.Looper
          import com.google.android.gms.location.FusedLocationProviderClient
          import com.google.android.gms.location.LocationCallback
          import com.google.android.gms.location.LocationRequest
          import com.google.android.gms.location.LocationResult
          import com.google.android.gms.location.LocationServices
          import com.google.android.gms.location.Priority
          import java.util.Locale

          class LocationService : Service() {
              companion object {
                  const val CH_ID = "aj_gps_channel_v1"
                  const val NOTIF_ID = 3001
                  var isRunning = false
                  var totalDistM = 0.0
                  var maxSpeedKmh = 0.0
                  var elevGainM = 0.0
                  var startTimeMs = 0L
                  var pointCount = 0
                  var satUsed = 0
                  var satTotal = 0
                  var latestJson = ""
                  var onLocationUpdate: ((String) -> Unit)? = null
                  var onStatusUpdate: ((String, String) -> Unit)? = null
              }

              private lateinit var lm: LocationManager
              private lateinit var fusedClient: FusedLocationProviderClient
              private var lastLoc: Location? = null
              private var lastNotifMs = 0L

              private val locCallback = object : LocationCallback() {
                  override fun onLocationResult(result: LocationResult) {
                      val loc = result.lastLocation ?: return
                      emitLocation(loc, isCached = false)
                  }
              }

              private val gnssCb = object : GnssStatus.Callback() {
                  override fun onSatelliteStatusChanged(status: GnssStatus) {
                      var used = 0
                      val total = status.satelliteCount
                      for (i in 0 until total) {
                          if (status.usedInFix(i)) used++
                      }
                      satUsed = used
                      satTotal = total
                      if (latestJson.isEmpty()) {
                          onStatusUpdate?.invoke("SEARCHING", "SAT $used/$total • LOCKING...")
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val hasFine = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val hasCoarse = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!hasFine && !hasCoarse) {
                      onStatusUpdate?.invoke("NO_PERM", "ALLOW LOCATION PERMISSION")
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (intent?.getBooleanExtra("reset", false) == true || !isRunning) {
                      totalDistM = 0.0
                      maxSpeedKmh = 0.0
                      elevGainM = 0.0
                      pointCount = 0
                      lastLoc = null
                      startTimeMs = System.currentTimeMillis()
                  }

                  isRunning = true
                  createChannel()
                  val notif = buildNotif("Locking Google Fused GPS...")
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                      } else {
                          startForeground(NOTIF_ID, notif)
                      }
                  } catch (e: Exception) {
                      onStatusUpdate?.invoke("ERR", "FG: ${e.message}")
                  }

                  lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  val gpsOn = try { lm.isProviderEnabled(LocationManager.GPS_PROVIDER) } catch (_: Exception) { false }
                  val netOn = try { lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER) } catch (_: Exception) { false }

                  if (!gpsOn && !netOn) {
                      onStatusUpdate?.invoke("GPS_OFF", "TURN ON PHONE LOCATION")
                  } else {
                      onStatusUpdate?.invoke("SEARCHING", "FUSED GPS ACTIVE • LOCKING...")
                  }

                  try {
                      @Suppress("DEPRECATION")
                      lm.registerGnssStatusCallback(gnssCb)
                  } catch (_: Exception) {}

                  fusedClient = LocationServices.getFusedLocationProviderClient(this)
                  try {
                      fusedClient.lastLocation.addOnSuccessListener { cached ->
                          if (cached != null) emitLocation(cached, isCached = true)
                      }
                  } catch (_: SecurityException) {}

                  try {
                      val req = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1000L)
                          .setMinUpdateIntervalMillis(500L)
                          .setMinUpdateDistanceMeters(0f)
                          .build()
                      fusedClient.removeLocationUpdates(locCallback)
                      fusedClient.requestLocationUpdates(req, locCallback, Looper.getMainLooper())
                  } catch (_: SecurityException) {}

                  return START_STICKY
              }

              private fun emitLocation(loc: Location, isCached: Boolean) {
                  if (!isCached) {
                      val prev = lastLoc
                      if (prev != null) {
                          val d = prev.distanceTo(loc).toDouble()
                          if (loc.accuracy <= 50f && d >= 1.2 && d <= 150.0) {
                              totalDistM += d
                              if (loc.hasAltitude() && prev.hasAltitude()) {
                                  val dAlt = loc.altitude - prev.altitude
                                  if (dAlt > 1.0 && dAlt < 30.0) elevGainM += dAlt
                              }
                          }
                      }
                      if (loc.accuracy <= 120f) {
                          lastLoc = loc
                          pointCount++
                      }
                  }

                  val speedMs = if (loc.hasSpeed()) loc.speed.toDouble() else 0.0
                  val speedKmh = if (speedMs * 3.6 > 0.3) speedMs * 3.6 else 0.0
                  if (speedKmh > maxSpeedKmh && speedKmh < 150.0) maxSpeedKmh = speedKmh

                  val elapsedSec = ((System.currentTimeMillis() - startTimeMs) / 1000L).coerceAtLeast(1L)
                  val avgSpeedKmh = (totalDistM / elapsedSec.toDouble()) * 3.6
                  val kcal = (totalDistM / 1000.0) * 65.0
                  val steps = (totalDistM / 0.78).toInt()
                  val bearing = if (loc.hasBearing()) loc.bearing.toDouble() else 0.0
                  val alt = if (loc.hasAltitude()) loc.altitude else 0.0

                  val json = String.format(
                      Locale.US,
                      "{\"lat\":%.6f,\"lng\":%.6f,\"acc\":%.1f,\"spd\":%.2f,\"spdMs\":%.2f,\"maxSpd\":%.2f,\"avgSpd\":%.2f,\"alt\":%.1f,\"elevGain\":%.1f,\"bearing\":%.1f,\"distM\":%.1f,\"kcal\":%.1f,\"steps\":%d,\"pts\":%d,\"sec\":%d,\"satU\":%d,\"satT\":%d,\"bg\":true}",
                      loc.latitude, loc.longitude, loc.accuracy, speedKmh, speedMs,
                      maxSpeedKmh, avgSpeedKmh, alt, elevGainM, bearing,
                      totalDistM, kcal, steps, pointCount, elapsedSec, satUsed, satTotal
                  )
                  latestJson = json
                  onLocationUpdate?.invoke(json)

                  val now = System.currentTimeMillis()
                  if (now - lastNotifMs >= 2000L) {
                      lastNotifMs = now
                      val km = totalDistM / 1000.0
                      val mins = elapsedSec / 60
                      val secs = elapsedSec % 60
                      val text = String.format(Locale.US, "%.2f km • %.1f km/h • %02d:%02d • ±%.0fm", km, speedKmh, mins, secs, loc.accuracy)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotif(text))
                  }
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val ch = NotificationChannel(CH_ID, "A.J Real-Time GPS", NotificationManager.IMPORTANCE_LOW)
                      nm.createNotificationChannel(ch)
                  }
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pi = PendingIntent.getActivity(this, 1, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, CH_ID)
                  else @Suppress("DEPRECATION") Notification.Builder(this)
                  return b.setContentTitle("A.J PRO GPS ACTIVE")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  isRunning = false
                  if (::fusedClient.isInitialized) {
                      try { fusedClient.removeLocationUpdates(locCallback) } catch (_: Exception) {}
                  }
                  if (::lm.isInitialized) {
                      try { lm.unregisterGnssStatusCallback(gnssCb) } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/aj/system/MainActivity.kt
          package com.aj.system

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.WindowManager
          import android.webkit.GeolocationPermissions
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar

          class MainActivity : Activity() {
              companion object {
                  @Volatile
                  var currentMapMode: String = "dark"
              }

              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  requestAppPerms()

                  web = WebView(this)
                  setContentView(web)

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                      setGeolocationEnabled(true)
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  web.addJavascriptInterface(AJBridge(this), "AJNative")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val urlStr = request?.url?.toString() ?: return null
                          if (urlStr.contains("carto", ignoreCase = true) ||
                              urlStr.contains("openstreetmap.org", ignoreCase = true) ||
                              urlStr.contains("opentopomap.org", ignoreCase = true) ||
                              urlStr.contains("arcgisonline.com", ignoreCase = true)) {
                              val cleanPath = urlStr.substringBefore("?")
                              val match = Regex("""/(\d+)/(\d+)/(\d+)""").find(cleanPath)
                              if (match != null) {
                                  val z = match.groupValues[1]
                                  val x = match.groupValues[2]
                                  val y = match.groupValues[3]
                                  val targetUrl = when (currentMapMode) {
                                      "sat" -> "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$z/$y/$x"
                                      "street" -> "https://tile.openstreetmap.org/$z/$x/$y.png"
                                      "topo" -> "https://tile.opentopomap.org/$z/$x/$y.png"
                                      else -> "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/$z/$y/$x"
                                  }
                                  try {
                                      val conn = (URL(targetUrl).openConnection() as HttpURLConnection).apply {
                                          connectTimeout = 8000
                                          readTimeout = 8000
                                          setRequestProperty("User-Agent", "AJSystemApp/2.3 (Android)")
                                      }
                                      if (conn.responseCode == 200) {
                                          val mime = conn.contentType?.substringBefore(";") ?: "image/png"
                                          val headers = mapOf(
                                              "Access-Control-Allow-Origin" to "*",
                                              "Cache-Control" to "no-store, no-cache"
                                          )
                                          return WebResourceResponse(mime, null, 200, "OK", headers, conn.inputStream)
                                      }
                                  } catch (_: Exception) {}
                              }
                          }
                          return super.shouldInterceptRequest(view, request)
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(origin: String?, cb: GeolocationPermissions.Callback?) {
                          cb?.invoke(origin, true, false)
                      }
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          runOnUiThread { request?.grant(request.resources) }
                      }
                      override fun onShowFileChooser(wv: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try {
                              val i = p?.createIntent()
                              if (i != null) startActivityForResult(i, 99)
                              true
                          } catch (_: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }

                  LocationService.onLocationUpdate = { json ->
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeGps && window.__onAJNativeGps($json);", null)
                      }
                  }
                  LocationService.onStatusUpdate = { code, msg ->
                      val safeMsg = msg.replace("'", "")
                      runOnUiThread {
                          web.evaluateJavascript("window.__onAJNativeGpsStatus && window.__onAJNativeGpsStatus('$code','$safeMsg');", null)
                      }
                  }

                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onPause() {
                  super.onPause()
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  web.evaluateJavascript("window.__ajResumeAudio && window.__ajResumeAudio();", null)
                  if (LocationService.isRunning) {
                      val i = Intent(this, LocationService::class.java).apply { putExtra("reset", false) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)
                      else startService(i)
                  }
                  if (LocationService.latestJson.isNotEmpty()) {
                      web.evaluateJavascript("window.__onAJNativeGps && window.__onAJNativeGps(${LocationService.latestJson});", null)
                  }
              }

              override fun onDestroy() {
                  LocationService.onLocationUpdate = null
                  LocationService.onStatusUpdate = null
                  web.evaluateJavascript("window.__ajPauseAudio && window.__ajPauseAudio();", null)
                  web.destroy()
                  super.onDestroy()
              }

              fun clearWebCache() {
                  runOnUiThread { web.clearCache(true) }
              }

              fun requestAppPerms() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val need = perms.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 101)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101) {
                      val hasLoc = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                                   checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                      if (hasLoc) {
                          val i = Intent(this, LocationService::class.java).apply { putExtra("reset", false) }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)
                          else startService(i)
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 99) {
                      val res = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      fileCb?.onReceiveValue(res)
                      fileCb = null
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              class AJBridge(private val ctx: Context) {
                  @JavascriptInterface
                  fun setMapMode(mode: String) {
                      currentMapMode = mode
                      (ctx as? MainActivity)?.clearWebCache()
                  }

                  @JavascriptInterface
                  fun openLocationSettings() {
                      try {
                          val i = Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          ctx.startActivity(i)
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun startBgGps(reset: Boolean) {
                      val hasLoc = ctx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                                   ctx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                      if (!hasLoc) {
                          LocationService.onStatusUpdate?.invoke("NO_PERM", "ALLOW LOCATION PERMISSION")
                          (ctx as? MainActivity)?.runOnUiThread { (ctx as? MainActivity)?.requestAppPerms() }
                          return
                      }
                      val i = Intent(ctx, LocationService::class.java).apply { putExtra("reset", reset) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i)
                      else ctx.startService(i)
                  }

                  @JavascriptInterface
                  fun stopBgGps() {
                      ctx.stopService(Intent(ctx, LocationService::class.java))
                      LocationService.onStatusUpdate?.invoke("STOPPED", "BG GPS STOPPED")
                  }

                  @JavascriptInterface
                  fun getBgGpsState(): String {
                      return LocationService.latestJson
                  }

                  @JavascriptInterface
                  fun isBgGpsRunning(): Boolean {
                      return LocationService.isRunning
                  }

                  @JavascriptInterface
                  fun scheduleAlarm(hour: Int, minute: Int, label: String) {
                      val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(ctx, AlarmReceiver::class.java).apply { putExtra("label", label) }
                      val pi = PendingIntent.getBroadcast(ctx, 777, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, hour)
                          set(Calendar.MINUTE, minute)
                          set(Calendar.SECOND, 0)
                          if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                      }
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          } else {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          }
                      } catch (_: Exception) {
                          am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      }
                  }

                  @JavascriptInterface
                  fun cancelAlarm() {
                      val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(ctx, 777, Intent(ctx, AlarmReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      am.cancel(pi)
                  }

                  @JavascriptInterface
                  fun showNotif(title: String, msg: String) {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val chId = "aj_alerts_v1"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(NotificationChannel(chId, "A.J Alerts", NotificationManager.IMPORTANCE_HIGH))
                      }
                      val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(ctx, chId)
                      else @Suppress("DEPRECATION") Notification.Builder(ctx)
                      nm.notify(2002, b.setContentTitle(title).setContentText(msg).setSmallIcon(android.R.drawable.ic_dialog_info).build())
                  }
              }
          }
          EOF

          HTML_FILE=$(find . -maxdepth 1 -iname "index.html" | head -n 1)
          cp "$HTML_FILE" app/src/main/assets/index.html

          python3 - << 'PYEOF'
          path = "app/src/main/assets/index.html"
          with open(path, "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          early_patch = """<script>
          (function(){
            // 1. Track all map tile Images so changing map mode refreshes canvas immediately
            window.__ajTileImgs = [];
            var OrigImage = window.Image;
            if (OrigImage) {
              var origDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
              var WrappedImage = function(w, h) {
                var img = arguments.length > 0 ? new OrigImage(w, h) : new OrigImage();
                if (origDesc && origDesc.set) {
                  try {
                    Object.defineProperty(img, 'src', {
                      get: function() { return origDesc.get.call(this); },
                      set: function(v) {
                        if (typeof v === 'string' && /carto|openstreetmap|opentopomap|arcgisonline/i.test(v)) {
                          if (window.__ajTileImgs.indexOf(img) === -1) {
                            window.__ajTileImgs.push(img);
                            if (window.__ajTileImgs.length > 160) window.__ajTileImgs.shift();
                          }
                        }
                        return origDesc.set.call(this, v);
                      },
                      configurable: true
                    });
                  } catch(e) {}
                }
                return img;
              };
              WrappedImage.prototype = OrigImage.prototype;
              window.Image = WrappedImage;
            }

            // 2. Auto Pause/Resume BGM & Audio when app goes to background
            var ctxList = [];
            var resumeCtxs = [];
            var resumeMedia = [];
            var OrigAC = window.AudioContext || window.webkitAudioContext;
            if (OrigAC) {
              var WrappedAC = function() {
                var c = new OrigAC();
                ctxList.push(c);
                return c;
              };
              WrappedAC.prototype = OrigAC.prototype;
              window.AudioContext = WrappedAC;
              if (window.webkitAudioContext) window.webkitAudioContext = WrappedAC;
            }
            window.__ajPauseAudio = function() {
              resumeCtxs = [];
              ctxList.forEach(function(c) {
                try {
                  if (c && c.state === 'running') {
                    resumeCtxs.push(c);
                    c.suspend();
                  }
                } catch(e) {}
              });
              resumeMedia = [];
              document.querySelectorAll('audio, video').forEach(function(m) {
                try {
                  if (!m.paused) {
                    resumeMedia.push(m);
                    m.pause();
                  }
                } catch(e) {}
              });
            };
            window.__ajResumeAudio = function() {
              resumeCtxs.forEach(function(c) { try { c.resume(); } catch(e) {} });
              resumeMedia.forEach(function(m) { try { m.play(); } catch(e) {} });
            };
            document.addEventListener('visibilitychange', function() {
              if (document.hidden) window.__ajPauseAudio();
              else window.__ajResumeAudio();
            });

            // 3. Hook Geolocation early to Native Google Fused LocationService
            window.__ajGpsWatchers = {};
            window.__ajSentFirstLock = false;
            var nextId = 100;
            function toGeoPos(d, forceGoodAcc) {
              return {
                coords: {
                  latitude: d.lat, longitude: d.lng,
                  accuracy: forceGoodAcc ? Math.min(d.acc || 15, 15) : d.acc,
                  altitude: d.alt, altitudeAccuracy: 5, heading: d.bearing, speed: d.spdMs
                },
                timestamp: Date.now()
              };
            }
            window.__ajToGeoPos = toGeoPos;

            if (window.AJNative && navigator.geolocation) {
              var proto = Object.getPrototypeOf(navigator.geolocation);
              var watchFn = function(success, error, opts) {
                var id = ++nextId;
                window.__ajGpsWatchers[id] = success;
                window.__ajSentFirstLock = false;
                try { window.AJNative.startBgGps(false); } catch(e) {}
                try {
                  var cached = window.AJNative.getBgGpsState();
                  if (cached) {
                    var d = JSON.parse(cached);
                    window.__ajSentFirstLock = true;
                    setTimeout(function(){ try { success(toGeoPos(d, true)); } catch(e) {} }, 150);
                  }
                } catch(e) {}
                return id;
              };
              var clearFn = function(id) {
                delete window.__ajGpsWatchers[id];
                if (Object.keys(window.__ajGpsWatchers).length === 0) {
                  try { window.AJNative.stopBgGps(); } catch(e) {}
                }
              };
              var getFn = function(success, error, opts) {
                var cached = '';
                try { cached = window.AJNative.getBgGpsState(); } catch(e) {}
                if (cached) { try { success(toGeoPos(JSON.parse(cached), true)); return; } catch(e) {} }
                var tid = ++nextId;
                window.__ajGpsWatchers[tid] = function(pos) {
                  delete window.__ajGpsWatchers[tid];
                  success(pos);
                };
                try { window.AJNative.startBgGps(false); } catch(e) {}
              };
              try {
                Object.defineProperty(proto, 'watchPosition', { value: watchFn, configurable: true, writable: true });
                Object.defineProperty(proto, 'clearWatch', { value: clearFn, configurable: true, writable: true });
                Object.defineProperty(proto, 'getCurrentPosition', { value: getFn, configurable: true, writable: true });
              } catch(e) {}
              try {
                Object.defineProperty(navigator.geolocation, 'watchPosition', { value: watchFn, configurable: true, writable: true });
                Object.defineProperty(navigator.geolocation, 'clearWatch', { value: clearFn, configurable: true, writable: true });
                Object.defineProperty(navigator.geolocation, 'getCurrentPosition', { value: getFn, configurable: true, writable: true });
              } catch(e) {}
            }
          })();
          </script>"""

          if "<head>" in html:
              html = html.replace("<head>", "<head>\n" + early_patch, 1)
          else:
              html = early_patch + "\n" + html

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF

