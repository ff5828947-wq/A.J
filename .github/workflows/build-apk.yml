              // --- 3-Layer Hybrid Step Engine (Counter + Detector + Accel Fallback) ---
              private fun todayKey(): String = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun loadTodaySteps() {
                  val savedDay = prefs.getString("steps_day", "")
                  val today = todayKey()
                  if (savedDay != today) {
                      todaySteps = 0
                      prefs.edit().putString("steps_day", today).putInt("steps_count", 0).putFloat("step_counter_base", -1f).apply()
                  } else {
                      todaySteps = prefs.getInt("steps_count", 0)
                  }
              }

              private fun setupStepSensors() {
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  stepCounterSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)
                  stepDetectorSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)
                  accelSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  hasHardwareSteps = (stepCounterSensor != null || stepDetectorSensor != null)
              }

              private fun registerStepListeners() {
                  try { sensorManager.unregisterListener(this) } catch (_: Exception) {}
                  val hasAct = checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED
                  if (hasAct) {
                      stepCounterSensor?.let { try { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) } catch (_: Exception) {} }
                      stepDetectorSensor?.let { try { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST) } catch (_: Exception) {} }
                  }
                  // Accelerometer fallback if hardware step sensors don't fire
                  accelSensor?.let { try { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) } catch (_: Exception) {} }
              }

              private fun addTodaySteps(delta: Int) {
                  if (delta <= 0) return
                  val today = todayKey()
                  if (prefs.getString("steps_day", "") != today) {
                      todaySteps = 0
                      prefs.edit().putString("steps_day", today).putFloat("step_counter_base", -1f).apply()
                  }
                  todaySteps += delta
                  prefs.edit().putInt("steps_count", todaySteps).apply()
                  emitStepsToWeb()
              }

              private fun emitStepsToWeb() {
                  runOnUiThread {
                      web.evaluateJavascript("window.__onAJNativeStep && window.__onAJNativeStep($todaySteps);", null)
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null) return
                  when (event.sensor.type) {
                      Sensor.TYPE_STEP_COUNTER -> {
                          receivedHwStep = true
                          val totalSinceBoot = event.values[0]
                          val today = todayKey()
                          if (prefs.getString("steps_day", "") != today) {
                              prefs.edit().putString("steps_day", today).putFloat("step_counter_base", totalSinceBoot).putInt("steps_count", 0).apply()
                              todaySteps = 0
                          } else {
                              var base = prefs.getFloat("step_counter_base", -1f)
                              if (base < 0f || totalSinceBoot < base) {
                                  base = totalSinceBoot - todaySteps
                                  prefs.edit().putFloat("step_counter_base", base).apply()
                              }
                              val calc = (totalSinceBoot - base).toInt().coerceAtLeast(todaySteps)
                              if (calc > todaySteps) {
                                  todaySteps = calc
                                  prefs.edit().putInt("steps_count", todaySteps).apply()
                                  emitStepsToWeb()
                              }
                          }
                      }
                      Sensor.TYPE_STEP_DETECTOR -> {
                          receivedHwStep = true
                          addTodaySteps(1)
                      }
                      Sensor.TYPE_ACCELEROMETER -> {
                          if (receivedHwStep) return
                          val ax = event.values[0].toDouble()
                          val ay = event.values[1].toDouble()
                          val az = event.values[2].toDouble()
                          val mag = sqrt(ax * ax + ay * ay + az * az)
                          grav = grav * 0.9 + mag * 0.1
                          val linear = mag - grav
                          val now = System.currentTimeMillis()
                          if (linear > 2.35 && now - lastAccelStepMs > 340L) {
                              lastAccelStepMs = now
                              addTodaySteps(1)
                          }
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              fun resetHardwareSteps() {
                  todaySteps = 0
                  prefs.edit().putString("steps_day", todayKey()).putInt("steps_count", 0).putFloat("step_counter_base", -1f).apply()
                  emitStepsToWeb()
              }

              fun triggerBiometricUnlock(reason: String = "Unlock ARISE System") {
                  runOnUiThread {
                      val bm = BiometricManager.from(this)
                      val authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK or BiometricManager.Authenticators.DEVICE_CREDENTIAL
                      if (bm.canAuthenticate(authenticators) != BiometricManager.BIOMETRIC_SUCCESS) {
                          isUnlockedThisSession = true
                          web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Device lock not set');", null)
                          return@runOnUiThread
                      }
                      val prompt = BiometricPrompt(this, ContextCompat.getMainExecutor(this), object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                              super.onAuthenticationSucceeded(result)
                              isUnlockedThisSession = true
                              triggerHaptic("success")
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(true, 'Verified');", null)
                          }
                          override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                              super.onAuthenticationError(errorCode, errString)
                              web.evaluateJavascript("window.__onAJBioResult && window.__onAJBioResult(false, '${errString.toString().replace("'", "")}');", null)
                          }
                          override fun onAuthenticationFailed() { super.onAuthenticationFailed(); triggerHaptic("heavy") }
                      })
                      val info = BiometricPrompt.PromptInfo.Builder().setTitle("ARISE SECURITY").setSubtitle(reason).setAllowedAuthenticators(authenticators).build()
                      try { prompt.authenticate(info) } catch (_: Exception) {}
                  }
              }

