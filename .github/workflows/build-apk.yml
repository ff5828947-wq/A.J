              private fun getVibrator(): Vibrator? = try { (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator } catch (_: Exception) { null }
              fun triggerHaptic(style: String = "tap") {
                  val mode = prefs.getString("haptic_mode", "soft") ?: "soft"
                  if (mode == "off") return
                  try {
                      val v = getVibrator() ?: return
                      if (!v.hasVibrator()) return
                      val effect = when (style) {
                          "success" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_DOUBLE_CLICK)
                          "heavy" -> VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)
                          else -> if (mode == "crisp") VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK) else VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK)
                      }
                      v.vibrate(effect)
                  } catch (_: Exception) {}
